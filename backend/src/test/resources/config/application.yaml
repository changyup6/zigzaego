# 테스트 전용 설정. classpath:/config/application.yaml 은 main 의 application.yaml 위에 덧씌워진다
# (main 파일을 가리지 않는다). 운영 키가 아니다 — 테스트에만 쓰는 고정값
spring:
  datasource:
    hikari:
      # 싱글톤 Testcontainers Postgres 를 여러 Spring TestContext 가 공유할 때 max_connections 초과를 막는다
      maximum-pool-size: 3

app:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef
  demo-account:
    # SignupTest 가 다시 가입해 보는 이메일. 실제 계정이 아니다
    email: demo-resignup@example.com
  onboarding-replay:
    # 저장본 재생을 기다리지 않는다. 지연 자체는 OnboardingPlaceSourceDelayTest 가 본다
    search-delay: 0s
    analysis-delay: 0s
  receipt:
    # CLOVA 키 없이 가짜 글자 인식으로 영수증 올리기 · 다시 읽기를 연다. 닫힌 상태는 ReceiptControllerTest 가 따로 본다
    allow-fake-ocr: true
    storage-dir: build/test-receipts
  receiving:
    auto:
      # 자동 입고 배치가 테스트 도중 저절로 돌아 다른 테스트의 발주 줄을 입고 처리하지 않게 끈다("-" = 스케줄 없음). AutoReceiveTest 는 메서드를 직접 부른다
      cron: "-"
