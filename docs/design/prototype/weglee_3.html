<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>위글리 발주 · 카드 피드 (전 화면)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap">
<style>
/* 위글리 발주 · 카드 피드 (토스·채널톡·마켓봄 손맛).
   회색 바닥 위 20px 둥근 흰 카드. 거래처별 카드 묶음에 마감 뱃지.
   빨강은 발주 버튼과 '주문 필요' 글자에만. 파랑 없음. */
:root{
  --ground:#F2F4F6; --paper:#ffffff; --paper-2:#F2F4F6;
  --ink:#191F28; --ink-2:#4E5968; --ink-3:#6B7684;
  --rule:#E5E8EB; --rule-soft:#F2F4F6;
  --red:#CF2229; --red-deep:#B31B21; --red-text:#CF2229; --red-tint:#FDECEC; --on-red:#ffffff;
  --amber-text:#8A5300; --ok-text:#1A7F4B; --ok-tint:#E3F3E8;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --numeral:"Inter Tight","Noto Sans KR",sans-serif;
  --r:20px; --rc:12px;
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --shell-h:56px; --tabs-h:64px; --act-h:76px;
  color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);caret-color:var(--red);font:400 15px/1.5 var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--red-tint);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
dl,ul,ol{margin:0;padding:0}
li{list-style:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.num{font-family:var(--numeral);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums;line-height:1}
.n40{font-size:40px}
.n24{font-size:28px}
.n17{font-size:18px}
.n14{font-size:14px}
.unit{font-family:var(--font);font-size:.5em;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:.1em}
.n14 .unit{font-size:.86em}

/* 상태 단어 = 색 글자 */
.badge{font-size:12px;font-weight:700;color:var(--red-text);white-space:nowrap}
.badge--ok{color:var(--ok-text)}
.badge--sky{color:var(--ink-2)}
.badge--dim{color:var(--ink-3)}
.badge .ic{width:14px;height:14px;vertical-align:-3px;margin-right:2px}

/* shell */
.app{min-height:100%;display:flex;flex-direction:column}
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:20px;height:var(--shell-h);padding:0 20px}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--red-text);white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-top:1px;letter-spacing:0}
.shell .today{font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.rail-nav{display:none}
.main{flex:1;padding-inline:16px;padding-block:0 calc(var(--tabs-h) + var(--act-h) + 32px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.screen-title{font-size:22px;padding:8px 4px 0}
.sub{color:var(--ink-3);font-size:13px;font-weight:500}

/* cards */
.block,.hero,.detail,.grp{background:var(--paper);border-radius:var(--r);padding:16px 20px;min-width:0}
#secOrder{background:transparent;padding:0;border-radius:0}
#secOrder > .block__head{padding:4px 4px 6px}
.block__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px}
.block__head h2{font-size:14px;font-weight:700;color:var(--ink-2)}
.block__head h2 .num{font-size:14px;color:var(--ink);margin-left:4px}
.block__empty{padding:8px 0 4px;color:var(--ink-2)}
.block__empty b{color:var(--ink)}
details.block > summary{list-style:none;cursor:pointer}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary.block__head{padding-bottom:0}
details.block[open] > summary.block__head{padding-bottom:8px}

/* hero card: 사실만. 폰에서는 달력보다 먼저. '오늘 주문' 소제목은 히어로와 겹치므로 숨김 */
#hero{order:-1}
#secOrder > .block__head{display:none}
.hero__title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero__title .num{font-size:22px;color:var(--red-text);margin:0 2px}
.hero__sub{margin-top:6px;font-size:13px;color:var(--ink-3);line-height:1.6;display:flex;flex-wrap:wrap;gap:0 14px}
.hero__sub b{color:var(--ink);font-weight:700}
.hero.is-done .hero__sub b{color:var(--ok-text)}

/* calendar: 세로 리스트 */
.cal{display:flex;flex-direction:column}
.cal__day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-soft);align-items:start;min-height:34px}
.cal__day:last-child{border-bottom:0}
.cal__date{font-size:13px;font-weight:700;color:var(--ink-2);line-height:1.2}
.cal__date small{display:block;font-size:10px;font-weight:500;color:var(--ink-3)}
.cal__day.is-today .cal__date{color:var(--red-text)}
.cal__items{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.cal__item{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap;word-break:keep-all;display:inline-flex;align-items:center;gap:3px}
.cal__item .ic{width:12px;height:12px}
.cal__item.is-today{background:var(--red-tint);color:var(--red-text)}
.cal__item.is-done{background:var(--ok-tint);color:var(--ok-text)}
.cal__none{color:#B0B8C1;font-size:11px;padding-top:5px}

/* supplier group cards + rows */
.grp{padding:12px 20px 2px;margin-top:4px}
.grp__h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;flex-wrap:wrap}
.grp__h small{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--paper-2);padding:3px 8px;border-radius:999px}
.row{border-bottom:1px solid var(--rule-soft)}
.grp .row:last-child{border-bottom:0}
.row > summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name qty" "meta state";column-gap:12px;row-gap:3px;padding:12px 0;cursor:pointer;min-height:64px;align-items:end}
.row > summary::-webkit-details-marker{display:none}
.row__name{grid-area:name;font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row__meta{grid-area:meta;font-size:12px;color:var(--ink-3);min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px}
.row__meta .nw{white-space:nowrap}
.row__qty{grid-area:qty;text-align:right;white-space:nowrap}
.row__state{grid-area:state;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:180px}
.row__state small{font-size:11px;font-weight:500;color:var(--ink-3);white-space:normal;line-height:1.3}
.row__state,.row__qty{transition:opacity 160ms var(--ease),transform 160ms var(--ease),filter 160ms var(--ease)}
.row.is-swapping .row__state,.row.is-swapping .row__qty{opacity:0;transform:translateY(-3px);filter:blur(2px)}
.row.is-held > summary{opacity:.55}
.row__body{padding:2px 0 16px;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){
  .row[open] .row__body{transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
  @starting-style{ .row[open] .row__body{opacity:0;transform:translateY(-4px)} }
}
@media (hover:hover) and (pointer:fine){ .row > summary:hover .row__name{color:var(--red-text)} }

.facts{display:grid;grid-template-columns:1fr auto;row-gap:6px;column-gap:16px;font-size:13px}
.facts dt{color:var(--ink-3)}
.facts dd{text-align:right;font-weight:600}
.facts dd.is-red{color:var(--red-text)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(7,1fr);row-gap:5px;font-size:11px;color:var(--ink-3);text-align:center}
.tl__day.is-today{color:var(--ink);font-weight:700}
.tl__track{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;height:12px;background:var(--rule);border-radius:6px}
.tl__stock{grid-row:1;height:12px;border-radius:6px;background:var(--ink)}
.tl__stock.is-short{background:var(--red)}
.tl__mark{grid-row:1;justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.tl__mark.is-red{border-color:var(--red);background:var(--red)}
.tl__lab{font-weight:700;color:var(--ink);white-space:nowrap}
.tl__lab .is-red{color:var(--red-text)}

.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper button{width:40px;height:40px;border:0;background:var(--paper-2);border-radius:50%;display:grid;place-items:center;transition:transform 160ms var(--ease),background-color 120ms ease}
.stepper button:active{transform:scale(.95)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper__val{min-width:84px;text-align:center}
.stepper__note{font-size:12px;color:var(--ink-3);flex:1 1 140px;min-width:0}
@media (hover:hover) and (pointer:fine){ .stepper button:hover{background:var(--rule)} }

.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.btn{height:46px;padding:0 18px;border-radius:var(--rc);border:0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform 160ms var(--ease),background-color 120ms ease}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--red);color:var(--on-red)}
.btn--primary:active{background:var(--red-deep)}
.btn--ghost{background:var(--paper-2);color:var(--ink-2)}
.btn--paper{background:var(--paper);color:var(--ink)}
.btn--quiet{background:transparent;color:var(--ink-2);padding-inline:10px;flex:0 0 auto}
.btn--sm{height:36px;padding:0 14px;font-size:13px;flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn--block{width:100%}
@media (hover:hover) and (pointer:fine){
  .btn--primary:hover{background:var(--red-deep)}
  .btn--ghost:hover{background:var(--rule)}
}

/* plain list rows */
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a b" "c d";column-gap:12px;row-gap:3px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:end}
.line:last-child{border-bottom:0}
.line__a{grid-area:a;font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.line__b{grid-area:b;text-align:right;white-space:nowrap}
.line__c{grid-area:c;font-size:12px;color:var(--ink-3);min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px}
.line__d{grid-area:d;text-align:right;font-size:12px;font-weight:700;white-space:nowrap}
.line__d.is-red{color:var(--red-text)}
.line__d.is-amber{color:var(--amber-text)}
.line__d.is-ok{color:var(--ok-text)}
.line__d.is-dim{color:var(--ink-3);font-weight:500}
.line--wide{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"a b e" "c d e";align-items:center}
.line__e{grid-area:e;display:flex;align-items:center;gap:8px}
.line--tight{padding:9px 0}
.line--tight .line__a{font-size:14px}
@media (max-width:899px){ #mapList .line--wide{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a b" "c d" "e e"} #mapList .line__e{margin-top:6px} #mapList .sel{width:100%} }

.recv{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:10px}

/* tables */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:600;color:var(--ink-3);padding:6px 16px 8px 0;border-bottom:1px solid var(--rule);font-size:12px}
.table td{padding:9px 16px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table th:last-child,.table td:last-child{padding-right:0}
.table .r{text-align:right;white-space:nowrap}
.table th.r{text-align:right}
.table .is-red{color:var(--red-text)}
.scroll-x{overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;color:var(--ink-3);font-weight:600}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--rule);background:var(--paper);border-radius:var(--rc);padding:0 12px;width:100%;min-width:0}
.field textarea{height:auto;min-height:104px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,select.sel:focus,.qty-in:focus,.addrow input[type=text]:focus{border-color:var(--ink);outline:none}
.field input::placeholder,.qty-in::placeholder,.addrow input::placeholder{color:#B0B8C1}
select.sel,.field select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B7684' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
select.sel{height:44px;border:1px solid var(--rule);background-color:var(--paper);border-radius:var(--rc);padding-left:12px;min-width:0}
select.sel:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qty-in{width:84px;height:44px;border:1px solid var(--rule);border-radius:var(--rc);background:var(--paper);text-align:right;padding:0 10px;appearance:textfield;-moz-appearance:textfield}
.qty-in::-webkit-outer-spin-button,.qty-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px}
.addrow .sel{flex:1 1 160px}
.addrow input[type=text]{flex:1 1 160px;height:44px;border:1px solid var(--rule);background:var(--paper);border-radius:var(--rc);padding:0 12px;min-width:0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--paper);white-space:nowrap;font-weight:600;font-size:13px;color:var(--ink-2);transition:transform 160ms var(--ease),background-color 120ms ease}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);vertical-align:2px;margin-left:6px}

/* 파일 버튼 */
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}

/* bottom action bar + tabs */
.actbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 16px 12px;background:linear-gradient(to top,var(--ground) 70%,transparent)}
.actbar__inner{max-width:728px;margin:0 auto}
.actbar .btn{height:54px;font-size:16px;border-radius:var(--rc)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#8B95A1;padding:0;transition:transform 120ms var(--ease)}
.tab:active{transform:scale(.95)}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{stroke-width:2.25}

/* dialog as bottom sheet */
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;max-height:92dvh;position:fixed;inset:auto 0 0 0;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;overflow:auto}
dialog.sheet::backdrop{background:rgba(25,31,40,.45)}
.sheet__in{padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.sheet__grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto}
.sheet__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px}
.sheet__head h2{font-size:20px}
.msg{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--rule-soft)}
.msg:last-of-type{border-bottom:0}
.msg__head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msg__head h3{font-size:16px}
.msg__body{white-space:pre-wrap;background:var(--paper-2);border-radius:var(--rc);padding:12px 14px;font-size:14px;line-height:1.55;user-select:text}
.msg__sum{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.msg__sum .is-red{color:var(--red-text);font-weight:700}
.msg__sum .is-ok{color:var(--ok-text);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet{transition:transform 240ms var(--ease-drawer),opacity 240ms var(--ease-drawer),overlay 240ms allow-discrete,display 240ms allow-discrete}
  dialog.sheet::backdrop{transition:background-color 240ms ease,overlay 240ms allow-discrete,display 240ms allow-discrete}
  dialog.sheet:not([open]){transform:translateY(100%);opacity:0}
  @starting-style{ dialog.sheet[open]{transform:translateY(100%);opacity:0} dialog.sheet[open]::backdrop{background:rgba(25,31,40,0)} }
}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabs-h) + 12px + env(safe-area-inset-bottom,0px));z-index:30;margin:0 auto;max-width:420px;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:var(--rc);font-size:13px;font-weight:600;text-align:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.toast.is-on{opacity:1;transform:translateY(0)}

/* ── 여기부터 추가 화면 (로그인 · 가입 · 온보딩 · 가격 · 영수증 · 확인 필요 · 가게 설정) ── */

/* 로그인 · 온보딩: 탭을 숨기고 하단 버튼만 */
.app[data-mode="flow"] .rail-nav,.app[data-mode="flow"] .tabs{display:none}
.app[data-mode="flow"] .main{padding-bottom:calc(var(--act-h) + 32px + env(safe-area-inset-bottom,0px))}
.app[data-mode="flow"] .actbar{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.step{font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.step b{font-family:var(--numeral);color:var(--ink);font-weight:700}

/* 화면 제목 줄: 제목 + 오른쪽 ⓘ */
.screen-head{display:flex;align-items:center;gap:8px;padding:8px 4px 0}
.screen-head .screen-title{padding:0;flex:1;min-width:0}

/* 로그인 */
.login{max-width:400px;width:100%;margin:0 auto;padding-top:min(14vh,120px)}
.login__mark{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--red-text);padding:0 4px 4px}
.login__store{font-size:14px;color:var(--ink-3);padding:0 4px 20px}
.login .block{display:flex;flex-direction:column;gap:14px;padding:20px}
.login__alt{display:flex;justify-content:center;padding-top:4px}

/* 검색 줄 */
.search{display:flex;gap:8px}
.search input{flex:1;height:46px;border:1px solid var(--rule);border-radius:var(--rc);background:var(--paper);padding:0 14px;min-width:0;font-size:16px}
.search input:focus,.linkin:focus{border-color:var(--ink);outline:none}
.search input::placeholder,.linkin::placeholder{color:#B0B8C1}
.linkin{width:100%;height:44px;border:1px solid var(--rule);border-radius:var(--rc);background:var(--paper);padding:0 12px;margin-top:8px}

/* 가게 후보 */
.cands{display:flex;flex-direction:column;margin-top:8px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:12px;align-items:center;width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;border:0;border-radius:var(--rc);background:transparent;text-align:left;transition:background-color 120ms ease}
.cand + .cand{margin-top:2px}
.cand__ph{width:48px;height:48px;border-radius:var(--rc);background:var(--paper-2);display:grid;place-items:center;color:var(--ink-3);font-weight:700;font-size:15px}
.cand__name{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.cand__addr{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.cand .ic{color:var(--red);opacity:0;transition:opacity 120ms ease}
.cand[aria-pressed="true"]{background:var(--paper-2)}
.cand[aria-pressed="true"] .ic{opacity:1}
@media (hover:hover) and (pointer:fine){ .cand:hover .cand__name{color:var(--red-text)} }
.ask{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ask b{font-size:15px}
.ask .chips{margin:0;padding:0;overflow:visible}
.block .chip{background:var(--paper-2)}
.block .chip[aria-pressed="true"]{background:var(--ink)}

/* 진행 바 */
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform 320ms var(--ease)}
.bar.is-red > i{background:var(--red)}
.bar--lg{height:12px;border-radius:6px}
.prog{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px}
.prog__label{font-size:14px;font-weight:600;color:var(--ink-2)}
.mline{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:8px;column-gap:12px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.mline:last-child{border-bottom:0}
.mline__name{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.mline__n{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.mline__n.is-ok{color:var(--ok-text)}
.mline .bar{grid-column:1/-1}
.fail{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fail b{color:var(--red-text);font-size:16px}

/* 레시피 질문 */
.q__count{font-size:13px;font-weight:600;color:var(--ink-3)}
.q__count b{font-family:var(--numeral);color:var(--ink)}
.q__title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.q__used{font-size:13px;color:var(--ink-3);margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.opts--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{height:76px;border:0;border-radius:var(--rc);background:var(--paper-2);display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--ink);transition:transform 160ms var(--ease),background-color 120ms ease}
.opt:active{transform:scale(.97);background:var(--rule)}
@media (hover:hover) and (pointer:fine){ .opt:hover{background:var(--rule)} }
.other{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.other .qty-in{flex:1 1 120px;width:auto}
.other .sel{flex:0 0 84px}
.q__more{margin-top:8px}

/* 홈: 가게 설정 체크리스트 */
.setup .block__head h2 .num{color:var(--ink)}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--rule-soft);background:none;text-align:left;font-size:15px;font-weight:600;color:var(--ink)}
.check:last-child{border-bottom:0}
.check__box{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule);display:grid;place-items:center;color:var(--paper)}
.check__box .ic{width:14px;height:14px;stroke-width:2.5}
.check .ic--go{width:16px;height:16px;color:var(--ink-3)}
.check.is-done{color:var(--ink-3);font-weight:500;cursor:default}
.check.is-done .check__box{background:var(--ok-text);box-shadow:none}
.check.is-done .ic--go{visibility:hidden}
@media (hover:hover) and (pointer:fine){ .check:not(.is-done):hover{color:var(--red-text)} }

/* 홈: 가게 설정 띠 (#50). 카드가 아니다 */
.strip{display:flex;align-items:center;gap:2px;width:calc(100% + 32px);height:36px;margin:-12px -16px 0;padding:0 20px;border:0;background:var(--red-tint);color:var(--red-text);font-size:13px;font-weight:600;text-align:left}
.strip .num{font-size:13px;margin-left:4px}
.strip .ic{width:16px;height:16px;margin-left:auto}
@media (hover:hover) and (pointer:fine){ .strip:hover{color:var(--red-deep)} }

/* 레시피: 메뉴 목록 (#45) */
.thumb{width:56px;height:56px;border-radius:var(--rc);background:var(--paper-2);display:grid;place-items:center;color:#B0B8C1;overflow:hidden;flex:none}
.thumb .ic{width:26px;height:26px}
.thumb--lg{width:72px;height:72px}
.thumb--lg .ic{width:32px;height:32px}
.menu-line{display:grid;grid-template-columns:56px minmax(0,1fr) auto 16px;gap:14px;align-items:center;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--rule-soft);background:none;text-align:left;color:var(--ink)}
.menu-line:last-child{border-bottom:0}
.menu-line__name{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.menu-line__meta{display:flex;gap:10px;font-size:12px;color:var(--ink-3);margin-top:3px}
.menu-line > .ic{width:16px;height:16px;color:var(--ink-3)}
@media (hover:hover) and (pointer:fine){ .menu-line:hover .menu-line__name{color:var(--red-text)} }
.menu-hd{display:flex;gap:14px;align-items:center;padding-bottom:12px}
.menu-hd h2{font-size:20px}
.back{align-self:flex-start;margin-left:-6px;gap:2px}
.back .ic{width:18px;height:18px}

/* 거래처 및 재료: 폰은 줄 목록, 데스크톱은 표 (#52) */
.ing-line{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;grid-template-areas:"a b g" "c c g";column-gap:12px;row-gap:3px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--rule-soft);background:none;text-align:left;color:var(--ink);align-items:center}
.ing-line:last-child{border-bottom:0}
.ing-line__a{grid-area:a;font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ing-line__b{grid-area:b;text-align:right;white-space:nowrap}
.ing-line__c{grid-area:c;font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 10px}
.ing-line > .ic{grid-area:g;width:16px;height:16px;color:var(--ink-3)}
.ing-line__b.is-review{background:var(--red-tint);border-radius:8px;padding:2px 6px}
.ing-table{display:none}
.ing-table tbody tr{cursor:pointer}
@media (hover:hover) and (pointer:fine){ .ing-table tbody tr:hover td:first-child{color:var(--red-text)} }
@media (min-width:900px){ .ing-lines{display:none} .ing-table{display:table} }

/* 더보기 */
.sub-head{padding-top:4px}
.sub-head h2{font-size:13px}
#mapWrap{padding-bottom:4px;border-bottom:1px solid var(--rule-soft);margin-bottom:4px}

/* 회원가입 약관 (#46) */
.terms{display:flex;flex-direction:column;border-top:1px solid var(--rule-soft);padding-top:4px}
.term{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.term--all{font-size:15px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--rule-soft)}
.term__req{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
.cbox{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule);flex:none;display:grid;place-items:center;cursor:pointer;transition:background-color 120ms ease}
.cbox:checked{background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5L20 7'/></svg>") center no-repeat;box-shadow:none}

/* 메시지 공유 (#49) */
.msg__acts{display:flex;gap:8px}
.msg.is-sent .msg__body{color:var(--ink-3)}
.sent{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--ok-text);white-space:nowrap}
.sent .ic{width:16px;height:16px}

/* 확인 필요 (설계 6절): 행 · 칸 연한 빨강, ⓘ 하나, 탭 배지 */
.sel.is-review,.qty-in.is-review{border-color:var(--red);background:var(--red-tint)}
td.is-review{background:var(--red-tint)}
.info{position:relative;flex:none}
.info__btn{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--red-text);display:grid;place-items:center;padding:0}
.info__btn .ic{width:20px;height:20px}
.info__pop{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:25;width:max-content;max-width:min(280px,calc(100vw - 32px));padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;line-height:1.45;transform-origin:top right}
.info.is-open .info__pop{display:block}
@media (hover:hover) and (pointer:fine){ .info:hover .info__pop{display:block} }
@media (prefers-reduced-motion:no-preference){
  .info__pop{transition:opacity 150ms var(--ease),transform 150ms var(--ease)}
  @starting-style{ .info.is-open .info__pop,.info:hover .info__pop{opacity:0;transform:scale(.97)} }
}
.tab{position:relative}
.tab__n{position:absolute;top:7px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:var(--on-red);font:700 10px/16px var(--numeral);text-align:center}

/* 가격: 배지 · 추이 · 비교 */
.price{display:flex;flex-direction:column;gap:10px;padding:14px 0 2px;border-top:1px solid var(--rule-soft)}
.price__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.price__head span{font-size:13px;color:var(--ink-3)}
.pbadge{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.pbadge.is-up{color:var(--red-text)}
.pbadge.is-down{color:var(--ok-text)}
.trend{display:grid;grid-template-columns:repeat(8,1fr);align-items:end;gap:4px;height:44px}
.trend i{display:block;border-radius:3px 3px 0 0;background:var(--rule);min-height:4px}
.trend i:last-child{background:var(--ink)}
.trend__x{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.cheap{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:var(--rc);background:var(--paper-2);padding:10px 12px;font-size:13px;color:var(--ink-2);text-align:left}
.cheap b{color:var(--ok-text)}
.cheap .ic{width:16px;height:16px;color:var(--ink-3);flex:none}
.pline .line__b .num{font-size:18px}
.src{display:inline-flex;gap:10px;flex-wrap:wrap}
.src .is-low{color:var(--ok-text);font-weight:700}
.src .is-old{color:#B0B8C1}

/* 영수증 */
.rc-line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.rc-line:last-child{border-bottom:0}
.rc-thumb{width:40px;height:40px;border-radius:var(--rc);background:var(--paper-2);display:grid;place-items:center;color:var(--ink-3)}
.rc-thumb .ic{width:18px;height:18px}
.rc-name{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rc-name small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.rc-st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.rc-st.is-wait{color:var(--ink-3);font-weight:500}
.rc-st.is-read{color:var(--ink-3)}
.rc-st.is-done{color:var(--ok-text)}
.rc-st.is-fail{color:var(--red-text)}
.rc-st .btn--sm{height:32px;padding:0 10px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:center}
.match:last-child{border-bottom:0}
.match__name{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.match__name small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:2px}
.match__ctl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.match__ctl .sel{flex:1 1 180px}
.match__unit{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.match__unit .qty-in{width:84px}

/* 스위치 */
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--rule);position:relative;flex:none;cursor:pointer;margin:0;transition:background-color 160ms ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);transition:transform 160ms var(--ease)}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(18px)}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule-soft);font-size:15px;font-weight:600}
.set-line:last-child{border-bottom:0}
.set-line .sub{font-weight:500}
.quiet-end{display:flex;justify-content:center;padding:8px 0}

@media (min-width:900px){
  .rail-nav .tab__n{position:static;margin-left:4px;align-self:center}
  .login{padding-top:12vh}
  .app[data-mode="flow"] .actbar__inner{max-width:760px}
}

.hero{position:relative}
.hero [data-info]{position:absolute;top:10px;right:10px}
#setup{order:-2}
#secCal{order:1}
#secFine{order:2}
#setupSec{scroll-margin-top:calc(var(--shell-h) + 12px)}
#ingTable td:last-child{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* desktop: 상단 바 + 2열 (피드 / 드로어) */
.detail{display:none}
@media (min-width:900px){
  .shell{padding:0 28px}
  .rail-nav{display:flex;gap:20px;margin-right:auto;order:2}
  .shell .today{order:3}
  .rail-nav .tab{flex-direction:row;height:56px;padding:0;font-size:14px;font-weight:500;color:#8B95A1;gap:0}
  .rail-nav .tab .ic{display:none}
  .rail-nav .tab[aria-current="page"]{color:var(--ink);font-weight:700}
  .main{padding-inline:28px;padding-block:0 calc(var(--act-h) + 40px);max-width:1096px}
  .screen{max-width:760px;margin-inline:auto;padding-top:20px}
  #s-home{display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:20px;row-gap:12px;max-width:1040px;align-items:start}
  #s-home > *{grid-column:1}
  #detailPane{grid-column:2;grid-row:1/span 4;position:sticky;top:72px}
  .detail{display:block}
  #orderList .row__body{display:none}
  #orderList .row.is-selected .row__name{color:var(--red-text)}
  .detail__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .detail__head h2{font-size:20px}
  .detail__qty{margin-top:8px}
  .detail__qty .num{font-size:44px;letter-spacing:-.04em}
  .detail__meta{font-size:13px;color:var(--ink-3);margin:2px 0 14px}
  .detail__empty{color:var(--ink-2);padding:4px 0}
  .detail .row__body{padding:0}
  .detail .stepper__note{flex-basis:100%}
  .scroll-x,.chips{margin-inline:0;padding-inline:0}
  .tabs{display:none}
  .strip{width:100%;margin:0;border-radius:var(--rc)}
  .actbar{bottom:0;padding:12px 28px 20px}
  .actbar__inner{max-width:1040px}
  .toast{left:auto;right:24px;bottom:24px}
  dialog.sheet{inset:auto 0 0 0;max-width:640px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0ms !important}
  .btn:active,.stepper button:active,.chip:active,.tab:active{transform:none}
}

// ---------- 발주 엔진 (3주_개발_계획.md 4절과 같은 식) ----------
function plan(ing) {
  const s = SUP[ing.sup];
  const avg7 = r1(sum(ing.daily) / 7);
  const leadDemand = r1(sum(ing.daily.slice(1, 1 + s.lead)));
  const safety = r1(avg7 * ing.safetyDays);
  const rop = r1(leadDemand + safety);
  const position = r1(ing.stock + ing.onOrder);
  const coverDemand = r1(sum(ing.daily.slice(1, 1 + s.lead + s.cycle)));
  const target = r1(safety + coverDemand);
  const need = r1(target - position);
  let qty = need <= 0 ? 0 : Math.ceil(need / ing.pack) * ing.pack;
  qty = r1(Math.min(qty, ing.max));
  let st = ing.stock, runout = 7;
  if (sum(ing.daily) > 0) {
    for (let i = 0; i < 7; i++) {
      if (ing.onOrder && ing.arrive === i) st += ing.onOrder;
      st -= ing.daily[i];
      if (st <= 0) { runout = i; break; }
    }
  }
  const order = position <= rop && qty > 0;
  const status = order ? 'order' : runout <= 3 ? 'soon' : 'fine';
  // 주문 추천일: 오늘 주문이면 0, 아니면 소진 전날 도착하도록 역산
  const orderDay = order ? 0 : runout < 7 ? Math.max(0, Math.min(6, runout - s.lead - 1)) : null;
  return { avg7, leadDemand, safety, rop, position, target, need, qty, runout, order, status, orderDay, lead: s.lead, cycle: s.cycle };
}

// 타임라인: 오늘부터 7일. 막대 = 재고가 버티는 날, 점 = 도착, 빨간 점 = 소진
function timeline(ing, p) {
  const orderDay = p.orderDay ?? 0;
  const arrive = ing.onOrder && ing.arrive != null ? ing.arrive : Math.min(6, orderDay + p.lead);
  const days = Array.from({ length: 7 }, (_, i) => `<span class="tl__day ${i === 0 ? 'is-today' : ''}">${i === 0 ? '오늘' : dName(i)}</span>`).join('');
  const span = Math.min(7, p.runout);
  const short = p.runout < 7 && arrive > p.runout;
  const stock = span > 0 ? `<span class="tl__stock ${short ? 'is-short' : ''}" style="grid-column:1 / span ${span}"></span>` : '';
  const marks = [];
  if (p.runout < 7) marks.push(`<span class="tl__mark is-red" style="grid-column:${p.runout + 1}" title="소진"></span>`);
  marks.push(`<span class="tl__mark" style="grid-column:${arrive + 1}" title="도착"></span>`);
  const labs = Array.from({ length: 7 }, (_, i) => {
    const l = [];
    if (i === orderDay && !ing.onOrder) l.push('주문');
    if (i === arrive) l.push('도착');
    if (i === p.runout) l.push('<span class="is-red">소진</span>');
    return `<span class="tl__lab">${l.join(' ')}</span>`;
  }).join('');
  return `<div class="tl" aria-label="재고 타임라인">${days}<div class="tl__track">${stock}${marks.join('')}</div>${labs}</div>`;
}

// 발주·보류·수량: 행을 제자리에서 바꾼다 (160ms, 키보드면 즉시)
function patchRow(id, instant) {
  const row = $(`#orderList .row[data-id="${id}"]`);
  if (!row) { renderHome(); return; }
  const apply = () => {
    const ing = ING.find(i => i.id === id), p = plan(ing);
    row.querySelector('summary').innerHTML = rowSummary(ing, p);
    row.querySelector('.row__body').innerHTML = rowBody(ing, p);
    row.classList.toggle('is-approved', state.approved[id] != null);
    row.classList.toggle('is-held', !!state.held[id]);
    void row.offsetWidth;
    row.classList.remove('is-swapping');
    renderCal(); renderHero(ordersNow()); renderDetail(); renderActbar(ordersNow());
  };
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
  row.classList.add('is-swapping');
  setTimeout(apply, 160);
}

function renderActbar(orders) {
  const bar = $('#actbar');
  const FLOW_ACT = {
    find: () => ({ label:'다음', disabled: !(state.place || $('#linkIn').value.trim()), mode:'find' }),
    analyze: () => state.an.p >= 1 ? { label:'레시피 확인', mode:'toq' } : null,
  };
  if (FLOW.includes(state.tab)) {
    const a = FLOW_ACT[state.tab] && FLOW_ACT[state.tab]();
    bar.hidden = !a;
    if (a) { const b = $('#actBtn'); b.textContent = a.label; b.disabled = !!a.disabled; b.dataset.mode = a.mode; }
    return;
  }
  if (state.tab !== 'home' || !orders.length) { bar.hidden = true; return; }
  bar.hidden = false;
  const btn = $('#actBtn');
  const ids = orders.map(o => o.ing.id);
  const approved = ids.filter(id => state.approved[id] != null);
  const pending = ids.filter(id => !state.approved[id] && !state.held[id]);
  if (approved.length) { btn.textContent = `${approved.length}건 메시지 만들기`; btn.disabled = false; btn.dataset.mode = 'msg'; }
  else if (pending.length) { btn.textContent = '모두 발주'; btn.disabled = false; btn.dataset.mode = 'all'; }
  else { btn.textContent = '메시지 만들기'; btn.disabled = true; btn.dataset.mode = ''; }
}

const CAN_SHARE = typeof navigator.share === 'function' && matchMedia('(pointer:coarse)').matches;
async function shareText(id) {
  try { await navigator.share({ text: $(`#msg-${id}`).textContent }); state.sent[id] = true; openMessages(); }
  catch (e) { if (e.name !== 'AbortError') copyText(id); }
}
async function copyText(id) {
  const el = $(`#msg-${id}`);
  try { await navigator.clipboard.writeText(el.textContent); toast('복사됨'); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('길게 눌러 복사');
  }
}

function saveMessages() {

  { id:'m1', name:'냉동 칵테일새우 1kg', n:2, guess:'shrimp' },
  { id:'m2', name:'파마산 치즈 가루', n:1, guess:'parm', unit:true },
  { id:'m3', name:'키친타올 6롤', n:1, guess:'' },
];
let AUTO = 6; // 사전에 있어 자동 확정된 줄
const INFO = {
  home:'추정값 포함',
  receive:'미확인 상품',
  recipe:'미답변 재료',
  settings:'재고 확인 필요',
  more:'미연결 메뉴명',
};
const SETUP = [
  ['recipe', '레시피 확인', 'question'], ['pos', 'POS 연결', 'more'], ['supplier', '거래처 등록', 'settings'],
  ['receive', '첫 입고 확인', 'receive'], ['count', '재고 확인', 'settings'],
];
Object.assign(state, {
  setup:{ recipe:false, pos:true, supplier:false, receive:false, count:false },
  unanswered:new Set(['garlic']), countNeed:new Set(['perilla']),
  findQ:'', searched:false, place:null, yogi:true, linkOpen:false,
  an:{ p:0, variant:'', timer:null, stop:false }, qList:null, qPos:0, priceOn:true, sent:{}, ingEdit:null,
});

// ---------- 가격 ----------
function priceInfo(ing) {
  const h = histOf(ing), base = sum(h.slice(0, 7)) / 7;
  return { h, last: h[7], pct: Math.round((h[7] - base) / base * 100) };
}
const pbadge = pct => Math.abs(pct) < 5
  ? `<span class="pbadge">최근 8주와 비슷</span>`
  : `<span class="pbadge ${pct > 0 ? 'is-up' : 'is-down'}">최근 8주보다 ${pct > 0 ? '+' : ''}${pct}%</span>`;
function cheapest(ing) {
  const p = PRICE[ing.id]; if (!p) return null;
  return [['거래처', ing.price], ['식봄', p.s], ['쿠팡', p.c]].filter(x => x[1] != null).sort((a, b) => a[1] - b[1])[0];
}
const perUnit = (v, ing) => `<span class="num n14">${Math.round(v).toLocaleString('ko-KR')}</span>원/${ing.unit}`;
function priceBlock(ing) {
  if (!ing.price) return '';
  const { h, last, pct } = priceInfo(ing);
  const max = Math.max(...h), min = Math.min(...h);
  const bars = h.map(v => `<i style="height:${Math.round(20 + 80 * (v - min) / ((max - min) || 1))}%"></i>`).join('');
  // 식봄 · 쿠팡 최저가는 품목 상세에서만 (#48). 켬/끔은 더보기
  const p = PRICE[ing.id], low = cheapest(ing);
  const cell = (name, v, old) => v == null ? `<span class="is-old">${name} 없음</span>`
    : `<span class="${low[0] === name ? 'is-low' : ''} ${old ? 'is-old' : ''}">${name} ${Math.round(v).toLocaleString('ko-KR')}${old ? ' (어제)' : ''}</span>`;
  const cheap = state.priceOn && p
    ? `<div class="cheap"><span class="src">${cell('거래처', ing.price)}${cell('식봄', p.s)}${cell('쿠팡', p.c, p.cOld)}</span></div>` : '';
  return `<div class="price">
      <div class="price__head"><span>단가 ${perUnit(last, ing)}</span>${pbadge(pct)}</div>
      <div class="trend" aria-label="최근 8주 단가">${bars}</div>
      <div class="trend__x"><span>8주 전</span><span>이번 주</span></div>
      ${cheap}
    </div>`;
}
// ---------- 홈: 가게 설정 체크리스트 (다 채우면 사라짐) ----------
function renderSetup() {
  const left = SETUP.filter(([k]) => !state.setup[k]).length;
  $('#setup').hidden = !left; $('#setupSec').hidden = !left;
  $('#setupN').textContent = left;
  $('#setupList').innerHTML = SETUP.map(([k, label]) => {
    const ok = state.setup[k];
    return `<button class="check ${ok ? 'is-done' : ''}" data-setup="${k}" ${ok ? 'aria-disabled="true"' : ''}>
      <span class="check__box">${ok ? icon('i-check') : ''}</span><span>${label}</span><svg class="ic ic--go" aria-hidden="true"><use href="#i-chev"/></svg>
    </button>`;

}

// ---------- 확인 필요: 탭 배지 · ⓘ ----------
const reviewCounts = () => ({
  home: ordersNow().filter(o => state.unanswered.has(o.ing.id) && state.approved[o.ing.id] == null).length,
  receive: MATCHES.length + RECEIPTS.filter(r => r.st === 'fail').length,

  settings: state.countNeed.size,

function renderBadges() {
  const c = reviewCounts();
  $$('.tab').forEach(b => {
    const n = c[b.dataset.go] || 0;
    let s = b.querySelector('.tab__n');
    if (!s) { s = document.createElement('span'); s.className = 'tab__n'; b.appendChild(s); }
    s.hidden = !n; s.textContent = n; s.setAttribute('aria-label', `확인 필요 ${n}`);
  });
  $$('[data-info]').forEach(el => {
    const n = c[el.dataset.info] || 0;
    el.innerHTML = n ? `<span class="info"><button class="info__btn" type="button" aria-label="확인 필요 안내" aria-expanded="false">${icon('i-info')}</button><span class="info__pop" role="tooltip">${INFO[el.dataset.info]}</span></span>` : '';
  });
}

// ---------- 온보딩 ① 가게 찾기 ----------
function renderFind() {
  const q = state.findQ.trim();
  const list = q ? PLACES.filter(p => p.name.includes(q) || p.addr.includes(q)) : [];
  $('#candList').innerHTML = list.map(p => `

  $('#linkIn').hidden = !showLink; $('#linkOpen').hidden = showLink;
  const sel = PLACES.find(p => p.id === state.place);
  $('#yogiyo').hidden = !(sel && sel.yogiyo);

// ---------- 온보딩 ② 메뉴 분석: 전체 진척도 하나를 메뉴 수로 나눠 바를 채운다 ----------
function startAnalyze(variant) {
  clearInterval(state.an.timer);
  state.an = { p:0, variant: variant || '', timer:null, stop:false };
  $('#anList').innerHTML = '';
  state.an.timer = setInterval(() => {
    const a = state.an;
    a.p = Math.min(1, Math.round((a.p + 0.016) * 1000) / 1000);
    if ((a.variant === 'fail' || a.variant === 'empty') && a.p >= 0.3) { a.p = 0.3; a.stop = true; }
    if (a.p >= 1 || a.stop) clearInterval(a.timer);
    renderAnalyze();
  }, 110);
  renderAnalyze();
}
function renderAnalyze() {
  const a = state.an, n = MENUS.length;
  const fail = a.variant === 'fail' && a.stop, empty = a.variant === 'empty' && a.stop, done = a.p >= 1;
  $('#anPct').innerHTML = `${Math.round(a.p * 100)}<span class="unit">%</span>`;
  $('#anBar i').style.transform = `scaleX(${a.p})`;
  $('#anBar').classList.toggle('is-red', fail);
  $('#anPhase').textContent = fail ? '가져오기 실패' : empty ? '메뉴 0개' : a.p < 0.3 ? '메뉴 가져오는 중'
    : a.p < 0.35 ? '메뉴 정리 중' : a.p < 0.9 ? '재료 구성 정리 중' : !done ? '질문 만드는 중' : '분석 완료';
  $('#anFail').hidden = !fail;
  $('#anDrop').hidden = !empty;
  $('#anMenus').hidden = fail || empty || a.p < 0.3;
  const list = $('#anList');
  if (list.children.length !== n) {
    list.innerHTML = MENUS.map(m => `<div class="mline"><span class="mline__name">${esc(m.name)}</span><span class="mline__n"></span></div>`).join('');
  }
  const mp = Math.max(0, (a.p - 0.3) / 0.7);
  MENUS.forEach((m, i) => {
    const f = Math.max(0, Math.min(1, mp * n - i));
    const row = list.children[i], lab = row.querySelector('.mline__n');
    // 재료 구성은 묶음 호출이 끝났을 때 한꺼번에 채운다 (설계 2.5절)
    lab.textContent = done ? `재료 ${Object.keys(m.recipe).length}개` : f >= 1 ? '' : f > 0 ? '정리 중' : '대기';
    lab.classList.toggle('is-ok', done);
  });
  renderActbar(ordersNow());
}

// ---------- 온보딩 ③ 레시피 확인 ----------
function startQuestions(all) {
  state.qList = QUESTIONS.map((_, i) => i).filter(i => all || state.unanswered.has(QUESTIONS[i].ing));
  if (!state.qList.length) state.qList = QUESTIONS.map((_, i) => i);
  state.qPos = 0;
}
function renderQuestion() {
  const q = QUESTIONS[state.qList[state.qPos]], n = state.qList.length;
  const txt = typeof q.opts[0] === 'string';
  $('#qCount').innerHTML = `질문 <b>${state.qPos + 1}</b> / ${n}`;
  $('#qTitle').textContent = q.title;
  $('#qUsed').textContent = q.used;
  $('#qOpts').className = 'opts' + (q.opts.length === 2 ? ' opts--2' : '');
  $('#qOpts').innerHTML = q.opts.map(o => `<button class="opt" type="button" data-opt="${esc(o)}">${txt ? esc(o) : numHTML(o, q.unit)}</button>`).join('');
  $('#qOther').hidden = true;
  $('#qMore').hidden = txt;
  $('#qOtherUnit').value = q.unit || 'g';
  $('#qOtherIn').value = '';
}
function answer(v) {
  const q = QUESTIONS[state.qList[state.qPos]];
  if (typeof v === 'number') MENUS.forEach(m => { if (q.ing in m.recipe) m.recipe[q.ing] = v; });
  else if (v === '안 넣음') MENUS.forEach(m => { delete m.recipe[q.ing]; });
  state.unanswered.delete(q.ing);
  state.qPos++;
  if (state.qPos >= state.qList.length) finishQuestions(); else renderQuestion();
}
function finishQuestions() {
  state.setup.recipe = state.unanswered.size === 0;
  state.qList = null;
  renderAll(); go('home');
  toast(state.setup.recipe ? '레시피 확인 완료' : `추정값 ${state.unanswered.size}개`);
}

// ---------- 입고: 영수증 처리 현황 · 확인 목록 (설계 4.4절) ----------
function renderReceipts() {
  const done = RECEIPTS.filter(r => r.st === 'done');
  const ST = { wait:['is-wait', '대기'], read:['is-read', '인식 중'], done:['is-done', '완료'], fail:['is-fail', '실패'] };
  $('#rcList').innerHTML = RECEIPTS.map(r => {
    const [c, l] = ST[r.st];
    const tail = r.st === 'fail'
      ? `<button class="btn btn--ghost btn--sm" data-rcretry="${r.id}" aria-label="${esc(r.file)} 다시 읽기">${icon('i-retry')}</button><button class="btn btn--quiet btn--sm" data-rcdel="${r.id}" aria-label="${esc(r.file)} 삭제">${icon('i-x')}</button>`
      : r.st === 'done' ? `<span style="color:var(--ink-3);font-weight:500">${r.kind === 'PAST' ? '지난 기록' : '입고'}</span>` : '';
    return `<div class="rc-line">
      <span class="rc-thumb">${icon('i-receipt')}</span>
      <span class="rc-name">${esc(r.file)}<small>${esc(r.at)}</small></span>
      <span class="rc-st ${c}">${r.st === 'done' ? icon('i-check') : ''}${l}${tail}</span>
    </div>`;
  }).join('');
  $('#matchCount').textContent = MATCHES.length || '';
  $('#matchList').innerHTML = MATCHES.length ? MATCHES.map(m => `
    <div class="match" data-match="${m.id}">
      <div class="match__name">“${esc(m.name)}”<small>영수증 ${m.n}장</small></div><div></div>
      <div class="match__ctl">
        <select class="sel is-review" aria-label="${esc(m.name)} 재료">${ING.map(i => `<option value="${i.id}" ${i.id === m.guess ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}<option value="cycle" ${m.guess ? '' : 'selected'}>주기형 품목</option></select>
        ${m.unit ? `<span class="match__unit">1개 = <input class="qty-in num n17 is-review" type="number" inputmode="decimal" min="0" value="1000" aria-label="1개당 g"> g</span>` : ''}
        <button class="btn btn--ghost" data-mconfirm="${m.id}">확인</button>
      </div>
    </div>`).join('') : `<p class="block__empty">모두 확인됨</p>`;
}
function processReceipts() {
  const r = RECEIPTS.find(x => x.st === 'wait' || x.st === 'read');
  if (!r) return;
  if (r.st === 'wait') r.st = 'read';
  else { r.st = 'done'; r.kind = r.id % 4 === 0 ? 'PAST' : 'RECEIVE'; AUTO += 2; }
  renderReceipts(); renderBadges();
  setTimeout(processReceipts, 700);
}
function addReceipts(files) {
  const busy = RECEIPTS.some(x => x.st === 'wait' || x.st === 'read');
  [...files].forEach((f, i) => RECEIPTS.push({ id: Date.now() + i, file: f.name, at: `${dShort(0)} 지금`, st: 'wait' }));
  renderReceipts();
  if (!busy) setTimeout(processReceipts, 400);
}

// ---------- 추가 화면 이벤트 ----------
document.addEventListener('click', e => {
  const ib = e.target.closest('.info__btn');
  $$('.info.is-open').forEach(i => { if (!ib || i !== ib.parentElement) { i.classList.remove('is-open'); i.querySelector('.info__btn').setAttribute('aria-expanded', 'false'); } });
  if (ib) { const o = ib.parentElement.classList.toggle('is-open'); ib.setAttribute('aria-expanded', String(o)); return; }
  const t = e.target.closest('[data-place],[data-yogi],[data-opt],[data-setup],[data-count],[data-rcretry],[data-rcdel],[data-mconfirm],#linkOpen,#anRetry,#qMore,#qSkip');
  if (!t) return;
  if (t.dataset.place) { state.place = state.place === t.dataset.place ? null : t.dataset.place; renderFind(); return; }
  if (t.dataset.yogi) { state.yogi = t.dataset.yogi === '1'; renderFind(); return; }
  if (t.dataset.opt != null) { const q = QUESTIONS[state.qList[state.qPos]]; answer(typeof q.opts[0] === 'number' ? Number(t.dataset.opt) : t.dataset.opt); return; }
  if (t.dataset.setup) {
    const [k, , to] = SETUP.find(s => s[0] === t.dataset.setup);
    if (state.setup[k]) return;
    if (k === 'recipe') startQuestions(false);
    go(to); return;
  }
  if (t.dataset.count) {
    state.countNeed.delete(t.dataset.count);
    if (!state.countNeed.size) state.setup.count = true;
    renderSettings(); renderSetup(); renderBadges();
    if ($('#ingDialog').open) openIng(state.ingEdit);
    return;
  }
  if (t.dataset.rcretry) { RECEIPTS.find(r => String(r.id) === t.dataset.rcretry).st = 'wait'; renderReceipts(); renderBadges(); setTimeout(processReceipts, 300); return; }
  if (t.dataset.rcdel) { RECEIPTS.splice(RECEIPTS.findIndex(r => String(r.id) === t.dataset.rcdel), 1); renderReceipts(); renderBadges(); return; }
  if (t.dataset.mconfirm) {
    const i = MATCHES.findIndex(m => m.id === t.dataset.mconfirm), m = MATCHES[i];
    MATCHES.splice(i, 1); AUTO += m.n;
    renderReceipts(); renderBadges(); return;
  }
  if (t.id === 'linkOpen') { state.linkOpen = true; renderFind(); $('#linkIn').focus(); return; }
  if (t.id === 'anRetry') { startAnalyze(''); return; }
  if (t.id === 'qMore') { $('#qOther').hidden = false; t.hidden = true; $('#qOtherIn').focus(); return; }
  if (t.id === 'qSkip') { finishQuestions(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.info.is-open').forEach(i => i.classList.remove('is-open')); });
$('#loginForm').addEventListener('submit', e => { e.preventDefault(); go('home'); });
// 회원가입: 필수 약관 셋을 모두 켜야 다음 (#46). 메뉴 · 사진 수집 범위를 여기서 고지한다 (#45)

$('#termAll').addEventListener('change', e => { $$('[data-term]').forEach(x => { x.checked = e.target.checked; }); syncTerms(); });
$$('[data-term]').forEach(x => x.addEventListener('change', syncTerms));
$('#signupForm').addEventListener('submit', e => { e.preventDefault(); go('find'); });
$('#findForm').addEventListener('submit', e => { e.preventDefault(); state.findQ = $('#findQ').value; state.searched = true; state.place = null; renderFind(); });
$('#qOther').addEventListener('submit', e => {

$('#linkIn').addEventListener('input', () => renderActbar(ordersNow()));
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'anFile' && t.files.length) { startAnalyze(''); return; }
  if (t.id === 'qFile' && t.files.length) {
    // 파일에 있는 구성요소는 질문을 건너뛴다 (설계 2.6절). 예시: 앞의 넷이 파일에 있었다고 본다
    const skip = state.qList.slice(state.qPos, state.qPos + 4);
    skip.forEach(i => state.unanswered.delete(QUESTIONS[i].ing));
    state.qPos += skip.length;
    toast('레시피 파일 반영');
    if (state.qPos >= state.qList.length) finishQuestions(); else renderQuestion();
    return;
  }
  if (t.id === 'rcFile' && t.files.length) { addReceipts(t.files); t.value = ''; return; }
  if (t.id === 'priceOn') { state.priceOn = t.checked; renderHome(); return; }
});

// ---------- 공통 ----------
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('is-on'), 2400);
}
const FLOW = ['login', 'signup', 'find', 'analyze', 'question'];
const SCREENS = ['home', 'receive', 'recipe', 'settings', 'more', ...FLOW];
const STEP = { find:1, analyze:2, question:3 };
function go(tab) {
  const hash = tab; let variant = '';
  if (tab.startsWith('analyze-')) { variant = tab.slice(8); tab = 'analyze'; } // #analyze-fail · #analyze-empty
  const toSetup = tab === 'more-setup'; if (toSetup) tab = 'more';
  if (!SCREENS.includes(tab)) tab = 'home';
  state.tab = tab;
  $$('.screen').forEach(s => { s.hidden = s.id !== 's-' + tab; });
  const navTab = tab;
  $$('.tab').forEach(b => { if (b.dataset.go === navTab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('.app').dataset.mode = FLOW.includes(tab) ? 'flow' : '';
  $('#todayLabel').innerHTML = STEP[tab] ? `<span class="step"><b>${STEP[tab]}</b> / 3</span>` : tab === 'login' || tab === 'signup' ? '' : todayText;
  if (tab === 'recipe') { state.menu = null; renderRecipe(); }
  if (tab === 'find') renderFind();
  if (tab === 'analyze') startAnalyze(variant);
  if (tab === 'question') { if (!state.qList) startQuestions(true); renderQuestion(); }
  renderActbar(ordersNow());
  const h = SCREENS.includes(hash) || variant ? hash : tab; state.hash = h;
  if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h);
  window.scrollTo({ top: 0 });
  if (toSetup) $('#setupSec').scrollIntoView({ block: 'start' });
}
function renderAll() { renderHome(); renderReceive(); renderRecipe(); renderSettings(); renderUpload(); renderReceipts(); renderSetup(); renderBadges(); }

// ---------- 이벤트 ----------
document.addEventListener('click', e => {
  const sm = e.target.closest('#orderList summary');
  if (sm && matchMedia('(min-width:900px)').matches) {
    e.preventDefault();
    state.selected = sm.parentElement.dataset.id;
    $$('#orderList .row').forEach(r => r.classList.toggle('is-selected', r.dataset.id === state.selected));
    renderDetail();
    return;
  }
  const t = e.target.closest('[data-go],[data-step],[data-approve],[data-hold],[data-recv],[data-recvok],[data-recvcancel],[data-copy],[data-share],[data-sent],[data-fill],[data-menu],[data-menuback],[data-open],[data-close],[data-ing],[data-recdel],[data-supsave],#actBtn,#msgClose,#msgSave,#mapSave');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.step) {
    const id = t.closest('[data-stepper]').dataset.stepper; const ing = ING.find(i => i.id === id);
    state.qty[id] = r1(Math.min(ing.max, Math.max(ing.pack, state.qty[id] + ing.pack * Number(t.dataset.step))));
    if (state.approved[id] != null) state.approved[id] = state.qty[id];
    patchRow(id, true); return;
  }
  if (t.dataset.approve) { const id = t.dataset.approve; if (state.approved[id] != null) delete state.approved[id]; else { state.approved[id] = state.qty[id]; delete state.held[id]; } patchRow(id, e.detail === 0); return; }
  if (t.dataset.hold) { const id = t.dataset.hold; if (state.held[id]) delete state.held[id]; else { state.held[id] = true; delete state.approved[id]; } patchRow(id, e.detail === 0); return; }
  if (t.dataset.recv) return startReceive(t.dataset.recv);
  if (t.dataset.recvok) return finishReceive(t.dataset.recvok);
  if (t.dataset.recvcancel) { t.closest('.recv').remove(); return; }
  if (t.dataset.copy) return copyText(t.dataset.copy);
  if (t.dataset.share) return shareText(t.dataset.share);
  if (t.dataset.sent) { state.sent[t.dataset.sent] = true; openMessages(); return; }
  if (t.dataset.fill) { state.fill[t.dataset.fill] = true; openMessages(); return; }
  if (t.dataset.menu) { state.menu = t.dataset.menu; renderRecipe(); window.scrollTo({ top: 0 }); return; }
  if (t.hasAttribute('data-menuback')) { state.menu = null; renderRecipe(); return; }
  if (t.dataset.open === 'addDialog') return openAdd();
  if (t.hasAttribute('data-close')) { t.closest('dialog').close(); return; }
  if (t.dataset.ing) { if (!e.target.closest('[data-count]')) openIng(t.dataset.ing); return; }
  if (t.dataset.recdel) { const m = MENUS.find(x => x.id === state.menu); delete m.recipe[t.dataset.recdel]; renderRecipe(); renderHome(); return; }
  if (t.dataset.supsave) { state.setup.supplier = true; renderSetup(); return; }
  if (t.id === 'actBtn') {
    if (t.dataset.mode === 'find') return go('analyze');
    if (t.dataset.mode === 'toq') { QUESTIONS.forEach(q => state.unanswered.add(q.ing)); startQuestions(true); return go('question'); }
    if (t.dataset.mode === 'all') { ING.forEach(i => { if (plan(i).status === 'order' && !state.held[i.id]) state.approved[i.id] = state.qty[i.id]; }); renderHome(); }
    openMessages(); return;
  }
  if (t.id === 'msgClose') { $('#msgDialog').close(); return; }
  if (t.id === 'msgSave') return saveMessages();
  if (t.id === 'mapSave') { UNMAPPED.length = 0; renderUpload(); renderBadges(); return; }
});
$('#addForm').addEventListener('submit', e => { e.preventDefault(); addRecipeRow(); });
$('#ingForm').addEventListener('submit', e => { e.preventDefault(); saveIng(); });
document.addEventListener('change', e => {
  const inp = e.target;
  if (inp.id === 'addSel') { syncAddRow(); if (inp.value === '__new') $('#addName').focus(); return; }
  if (inp.dataset.recin) {
    const m = MENUS.find(x => x.id === state.menu); const v = parseFloat(inp.value);
    if (!isNaN(v) && v >= 0) { m.recipe[inp.dataset.recin] = v; renderHome(); }
    return;
  }
  if (inp.id === 'fileIn' && inp.files && inp.files[0]) {
    const f = inp.files[0];
    UPLOADS.unshift({ date: `${dShort(0)} 지금`, file: f.name, rows: 1188, ok: false });
    renderUpload();
    setTimeout(() => { UPLOADS[0].ok = true; renderUpload(); }, 1400);
  }
});
$$('dialog.sheet').forEach(d => d.addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); }));

// ---------- 시작 ----------
const todayText = `${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${dName(0)}요일`;
renderAll();
go(location.hash.slice(1) || 'home');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== state.hash) go(h); });
})();
</script>
