<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>위글리 발주 · 벤토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 위글리 발주 · 벤토 작전판.
   크림 캔버스 위 흰 타일. 타일 크기 = 중요도. 숫자 하나만 크고 나머지는 작게.
   레드는 행동 버튼과 '주문 필요'에만. 레일 없음: 상단 바 하나. */
:root{
  --ground:#F4F2EC; --paper:#ffffff; --paper-2:#F4F2EC;
  --ink:#1C1B17; --ink-2:#55514A; --ink-3:#6F6A60;
  --rule:#E4E0D6; --rule-soft:#EFECE4;
  --red:#CF2229; --red-deep:#B31B21; --red-text:#B31B21; --red-tint:#FBE9E8; --on-red:#ffffff;
  --amber-text:#8A5300; --amber-tint:#FFF1DB;
  --ok-text:#1A7F4B; --ok-tint:#E3F3E8;
  --sky-text:#1D4F91; --sky-tint:#E6F0FB;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Bricolage Grotesque","IBM Plex Sans KR",sans-serif;
  --r:18px;
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --shell-h:56px; --tabs-h:64px; --act-h:76px;
  color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);caret-color:var(--red);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--red-tint);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
dl,ul,ol{margin:0;padding:0}
li{list-style:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.num{font-family:var(--display);font-weight:800;font-variation-settings:"opsz" 96;letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums;line-height:1}
.n40{font-size:40px}
.n24{font-size:24px}
.n17{font-size:17px}
.n14{font-size:14px;font-weight:700}
.unit{font-family:var(--font);font-size:.55em;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:.12em}
.n14 .unit{font-size:.86em}

/* badge: 상태 단어 = 옅은 알약 */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink-2);white-space:nowrap;line-height:1.3}
.badge--red{background:var(--red-tint);color:var(--red-text)}
.badge--ok{background:var(--ok-tint);color:var(--ok-text)}
.badge--sky{background:var(--sky-tint);color:var(--sky-text)}
.badge--dim{background:var(--paper-2);color:var(--ink-3)}
.badge .ic{width:14px;height:14px;vertical-align:-3px;margin-right:2px}

/* shell: 상단 바 하나 (데스크톱은 알약 내비가 가운데) */
.app{min-height:100%;display:flex;flex-direction:column}
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:20px;height:var(--shell-h);padding:0 16px}
.brand{font:800 20px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font:500 11px var(--font);color:var(--ink-3);margin-top:3px;letter-spacing:0}
.shell .today{font-weight:600;font-size:14px;white-space:nowrap}
.rail-nav{display:none}
.main{flex:1;padding-inline:16px;padding-block:0 calc(var(--tabs-h) + var(--act-h) + 32px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.screen-title{font-size:26px;padding:6px 4px 0}
.sub{color:var(--ink-3);font-size:13px;font-weight:600}

/* tiles */
.block,.hero,.detail{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;min-width:0}
.block__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px}
.block__head h2{font:600 13px var(--font);color:var(--ink-3);letter-spacing:0}
.block__head h2 .num{font-size:13px;color:var(--ink);margin-left:4px}
.block__empty{padding:8px 0 4px;color:var(--ink-2)}
.block__empty b{color:var(--ink)}
details.block > summary{list-style:none;cursor:pointer}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary.block__head{padding-bottom:0}
details.block[open] > summary.block__head{padding-bottom:8px}

/* hero tile (폰에서는 달력보다 먼저) */
#hero{order:-1}
.hero__big{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.hero__big .num{font-size:88px;letter-spacing:-.05em}
.hero__big small{font-size:24px;font-weight:600;color:var(--ink-3)}
.hero.is-done .hero__big .num{color:var(--ok-text)}
.hero__dead{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:6px}
.hero__dead .ic{width:16px;height:16px}
.hero__prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.hero__bar{flex:1;height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.hero__bar i{display:block;height:100%;width:2%;background:var(--red);border-radius:4px;transition:width 240ms var(--ease)}
.hero.is-done .hero__bar i{background:var(--ok-text)}
.hero__prog span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero__stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-soft)}
.hero__stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero__stats dt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.hero__stats dd{margin:0;font-size:18px}

/* calendar: 세로 리스트 (폰·데스크톱 동일) */
.cal{display:flex;flex-direction:column}
.cal__day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-soft);align-items:start;min-height:34px}
.cal__day:last-child{border-bottom:0}
.cal__date{font-size:13px;font-weight:700;line-height:1.2}
.cal__date small{display:block;font-size:10px;font-weight:500;color:var(--ink-3)}
.cal__day.is-today .cal__date{color:var(--red-text)}
.cal__items{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.cal__item{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--paper-2);white-space:nowrap;word-break:keep-all;display:inline-flex;align-items:center;gap:3px}
.cal__item .ic{width:12px;height:12px}
.cal__item.is-today{background:var(--red-tint);color:var(--red-text)}
.cal__item.is-done{background:var(--ok-tint);color:var(--ok-text)}
.cal__none{color:#B5AFA3;font-size:11px;padding-top:4px}

/* supplier groups + rows */
.grp__h{display:flex;align-items:baseline;gap:8px;font:600 12px var(--font);color:var(--ink);margin:10px 0 0;letter-spacing:0}
.grp__h small{font-weight:500;color:var(--ink-3)}
.row{border-bottom:1px solid var(--rule-soft)}
.grp .row:last-child{border-bottom:0}
.row > summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name qty" "meta state";column-gap:12px;row-gap:3px;padding:10px 0;cursor:pointer;min-height:60px;align-items:end}
.row > summary::-webkit-details-marker{display:none}
.row__name{grid-area:name;font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row__meta{grid-area:meta;font-size:12px;color:var(--ink-3);min-width:0;font-weight:500}
.row__meta .nw{white-space:nowrap}
.row__meta .nw + .nw::before{content:" · ";white-space:normal}
.row__spark{display:none}
.row__qty{grid-area:qty;text-align:right;white-space:nowrap}
.row__state{grid-area:state;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:180px}
.row__state small{font-size:11px;font-weight:500;color:var(--ink-3);white-space:normal;line-height:1.3}
.row__state,.row__qty{transition:opacity 160ms var(--ease),transform 160ms var(--ease),filter 160ms var(--ease)}
.row.is-swapping .row__state,.row.is-swapping .row__qty{opacity:0;transform:translateY(-3px);filter:blur(2px)}
.row.is-held > summary{opacity:.55}
.row__body{padding:4px 0 16px;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){
  .row[open] .row__body{transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
  @starting-style{ .row[open] .row__body{opacity:0;transform:translateY(-4px)} }
}
@media (hover:hover) and (pointer:fine){ .row > summary:hover .row__name{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px} }

.facts{display:grid;grid-template-columns:1fr auto;row-gap:5px;column-gap:16px;font-size:13px}
.facts dt{color:var(--ink-3)}
.facts dd{text-align:right}
.facts dd.is-red{color:var(--red-text)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(7,1fr);row-gap:5px;font-size:11px;color:var(--ink-3);text-align:center}
.tl__day.is-today{color:var(--ink);font-weight:700}
.tl__track{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;height:12px;background:var(--paper-2);border-radius:6px}
.tl__stock{grid-row:1;height:12px;border-radius:6px;background:var(--ink)}
.tl__stock.is-short{background:var(--red)}
.tl__mark{grid-row:1;justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.tl__mark.is-red{border-color:var(--red);background:var(--red)}
.tl__lab{font-weight:700;color:var(--ink);white-space:nowrap}
.tl__lab .is-red{color:var(--red-text)}
.tl__note{grid-column:1/-1;text-align:left;font-size:13px;color:var(--ink-2);padding-top:2px}
.tl__note b{color:var(--ink)}

.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper button{width:40px;height:40px;border:1px solid #D9D4C8;background:var(--paper);border-radius:50%;display:grid;place-items:center;transition:transform 160ms var(--ease),background-color 120ms ease}
.stepper button:active{transform:scale(.95)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper__val{min-width:84px;text-align:center}
.stepper__note{font-size:12px;color:var(--ink-3);flex:1 1 140px;min-width:0}
@media (hover:hover) and (pointer:fine){ .stepper button:hover{background:var(--paper-2)} }

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 18px;border-radius:999px;border:0;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform 160ms var(--ease),background-color 120ms ease}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--red);color:var(--on-red)}
.btn--primary:active{background:var(--red-deep)}
.btn--ghost{background:var(--paper-2);color:var(--ink)}
.btn--quiet{background:transparent;color:var(--ink-2);padding-inline:10px}
.btn--sm{height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn--block{width:100%}
@media (hover:hover) and (pointer:fine){
  .btn--primary:hover{background:var(--red-deep)}
  .btn--ghost:hover{background:#ECE8DF}
}

/* plain list rows */
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a b" "c d";column-gap:12px;row-gap:3px;padding:10px 0;border-bottom:1px solid var(--rule-soft);align-items:end}
.line:last-child{border-bottom:0}
.line__a{grid-area:a;font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.line__b{grid-area:b;text-align:right;white-space:nowrap}
.line__c{grid-area:c;font-size:12px;color:var(--ink-3);min-width:0}
.line__d{grid-area:d;text-align:right;font-size:12px;font-weight:700;white-space:nowrap}
.line__d.is-red{color:var(--red-text)}
.line__d.is-amber{color:var(--amber-text)}
.line__d.is-ok{color:var(--ok-text)}
.line__d.is-dim{color:var(--ink-3);font-weight:500}
.line--wide{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"a b e" "c d e";align-items:center}
.line__e{grid-area:e;display:flex;align-items:center;gap:8px}
.line--tight{padding:8px 0}
.line--tight .line__a{font-size:14px}

.recv{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:10px}

/* tables */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:600;color:var(--ink-3);padding:6px 16px 8px 0;border-bottom:1px solid var(--rule);font-size:12px}
.table td{padding:9px 16px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table th:last-child,.table td:last-child{padding-right:0}
.table .r{text-align:right;white-space:nowrap}
.table th.r{text-align:right}
.table .is-red{color:var(--red-text)}
.scroll-x{overflow-x:auto;margin-inline:-18px;padding-inline:18px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
#ingTable{min-width:720px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;color:var(--ink-3);font-weight:600}
.field input,.field select,.field textarea{height:42px;border:1px solid #D9D4C8;background:var(--paper);border-radius:10px;padding:0 12px;width:100%;min-width:0}
.field textarea{height:auto;min-height:104px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,select.sel:focus,.qty-in:focus,.addrow input[type=text]:focus{border-color:var(--ink);outline:none}
.field input::placeholder,.qty-in::placeholder,.addrow input::placeholder{color:#A39E93}
select.sel,.field select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236F6A60' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
select.sel{height:42px;border:1px solid #D9D4C8;background-color:var(--paper);border-radius:10px;padding-left:12px;min-width:0}
select.sel:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qty-in{width:84px;height:42px;border:1px solid #D9D4C8;border-radius:10px;background:var(--paper);text-align:right;padding:0 10px;appearance:textfield;-moz-appearance:textfield}
.qty-in::-webkit-outer-spin-button,.qty-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px}
.addrow .sel{flex:1 1 160px}
.addrow input[type=text]{flex:1 1 160px;height:42px;border:1px solid #D9D4C8;background:var(--paper);border-radius:10px;padding:0 12px;min-width:0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);white-space:nowrap;font-weight:600;font-size:13px;transition:transform 160ms var(--ease),background-color 120ms ease}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);vertical-align:2px;margin-left:6px}

/* dropzone + stats */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:132px;border:1px dashed #B5AFA3;border-radius:var(--r);background:var(--paper);padding:20px;text-align:center;cursor:pointer;color:var(--ink-3);position:relative}
.drop b{color:var(--ink);font:800 17px var(--display)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{border-color:var(--ink);border-style:solid}
@media (hover:hover) and (pointer:fine){ .drop:hover{background:#FBFAF7} }
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:6px}
.stats div{display:flex;flex-direction:column;gap:6px;background:var(--paper-2);border-radius:12px;padding:12px}
.stats span{font-size:12px;color:var(--ink-3);font-weight:600}

/* bottom action bar + tabs */
.actbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 16px 12px;background:linear-gradient(to top,var(--ground) 70%,transparent)}
.actbar__inner{max-width:728px;margin:0 auto}
.actbar .btn{height:52px;font-size:16px;box-shadow:0 8px 24px -10px rgba(207,34,41,.5)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:0;transition:transform 120ms var(--ease)}
.tab:active{transform:scale(.95)}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{stroke-width:2.25}

/* dialog as bottom sheet */
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;max-height:92dvh;position:fixed;inset:auto 0 0 0;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;overflow:auto}
dialog.sheet::backdrop{background:rgba(28,27,23,.45)}
.sheet__in{padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.sheet__grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto}
.sheet__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.sheet__head h2{font-size:20px}
.msg{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--rule-soft)}
.msg:last-of-type{border-bottom:0}
.msg__head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msg__head h3{font-size:16px}
.msg__body{white-space:pre-wrap;background:var(--paper-2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;user-select:text}
.msg__sum{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.msg__sum .is-red{color:var(--red-text);font-weight:700}
.msg__sum .is-ok{color:var(--ok-text);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet{transition:transform 240ms var(--ease-drawer),opacity 240ms var(--ease-drawer),overlay 240ms allow-discrete,display 240ms allow-discrete}
  dialog.sheet::backdrop{transition:background-color 240ms ease,overlay 240ms allow-discrete,display 240ms allow-discrete}
  dialog.sheet:not([open]){transform:translateY(100%);opacity:0}
  @starting-style{ dialog.sheet[open]{transform:translateY(100%);opacity:0} dialog.sheet[open]::backdrop{background:rgba(28,27,23,0)} }
}

/* toast */

// ---------- 발주 엔진 (3주_개발_계획.md 4절과 같은 식) ----------
function plan(ing) {
  const s = SUP[ing.sup];
  const avg7 = r1(sum(ing.daily) / 7);
  const leadDemand = r1(sum(ing.daily.slice(1, 1 + s.lead)));
  const safety = r1(avg7 * ing.safetyDays);
  const rop = r1(leadDemand + safety);
  const position = r1(ing.stock + ing.onOrder);
  const coverDemand = r1(sum(ing.daily.slice(1, 1 + s.lead + s.cycle)));
  const target = r1(safety + coverDemand);
  const need = r1(target - position);
  let qty = need <= 0 ? 0 : Math.ceil(need / ing.pack) * ing.pack;
  qty = r1(Math.min(qty, ing.max));
  let st = ing.stock, runout = 7;
  if (sum(ing.daily) > 0) {
    for (let i = 0; i < 7; i++) {
      if (ing.onOrder && ing.arrive === i) st += ing.onOrder;
      st -= ing.daily[i];
      if (st <= 0) { runout = i; break; }
    }
  }
  const order = position <= rop && qty > 0;
  const status = order ? 'order' : runout <= 3 ? 'soon' : 'fine';
  // 주문 추천일: 오늘 주문이면 0, 아니면 소진 전날 도착하도록 역산
  const orderDay = order ? 0 : runout < 7 ? Math.max(0, Math.min(6, runout - s.lead - 1)) : null;
  return { avg7, leadDemand, safety, rop, position, target, need, qty, runout, order, status, orderDay, lead: s.lead, cycle: s.cycle };
}
console.assert(plan(ING[0]).qty === 25, '파스타면 추천량은 25 kg');
console.assert(plan(ING[1]).runout === 1, '닭가슴살은 내일 소진');
console.assert(plan(ING[3]).status === 'soon', '새우는 곧 소진');

// 타임라인: 오늘부터 7일. 막대 = 재고가 버티는 날, 점 = 도착, 빨간 점 = 소진
function timeline(ing, p) {
  const orderDay = p.orderDay ?? 0;
  const arrive = ing.onOrder && ing.arrive != null ? ing.arrive : Math.min(6, orderDay + p.lead);
  const days = Array.from({ length: 7 }, (_, i) => `<span class="tl__day ${i === 0 ? 'is-today' : ''}">${i === 0 ? '오늘' : dName(i)}</span>`).join('');
  const span = Math.min(7, p.runout);
  const short = p.runout < 7 && arrive > p.runout;
  const stock = span > 0 ? `<span class="tl__stock ${short ? 'is-short' : ''}" style="grid-column:1 / span ${span}"></span>` : '';
  const marks = [];
  if (p.runout < 7) marks.push(`<span class="tl__mark is-red" style="grid-column:${p.runout + 1}" title="소진"></span>`);
  marks.push(`<span class="tl__mark" style="grid-column:${arrive + 1}" title="도착"></span>`);
  const labs = Array.from({ length: 7 }, (_, i) => {
    const l = [];
    if (i === orderDay && !ing.onOrder) l.push('주문');
    if (i === arrive) l.push('도착');
    if (i === p.runout) l.push('<span class="is-red">소진</span>');
    return `<span class="tl__lab">${l.join('·')}</span>`;
  }).join('');
  const note = p.runout >= 7
    ? `일주일 넘게 버텨요.`
    : ing.onOrder
      ? `<b>${dayLabel(p.runout)}</b> 소진, <b>${dayLabel(arrive)}</b> 도착.`
      : orderDay === 0
        ? `<b>${dayLabel(p.runout)}</b> 소진. 오늘 주문하면 <b>${dayLabel(arrive)}</b> 도착${short ? ', 하루 비어요' : ''}.`
        : `<b>${dayLabel(p.runout)}</b> 소진. <b>${dayLabel(orderDay)}</b> 주문하면 돼요.`;
  return `<div class="tl" aria-label="재고 타임라인">${days}<div class="tl__track">${stock}${marks.join('')}</div>${labs}<p class="tl__note">${note}</p></div>`;
}

// 승인·보류·수량: 행을 제자리에서 바꾼다 (160ms, 키보드면 즉시)
function patchRow(id, instant) {
  const row = $(`#orderList .row[data-id="${id}"]`);
  if (!row) { renderHome(); return; }
  const apply = () => {
    const ing = ING.find(i => i.id === id), p = plan(ing);
    row.querySelector('summary').innerHTML = rowSummary(ing, p);
    row.querySelector('.row__body').innerHTML = rowBody(ing, p);
    row.classList.toggle('is-approved', state.approved[id] != null);
    row.classList.toggle('is-held', !!state.held[id]);
    void row.offsetWidth;
    row.classList.remove('is-swapping');
    renderCal(); renderHero(ordersNow()); renderDetail(); renderActbar(ordersNow());
  };
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(); return; }
  row.classList.add('is-swapping');
  setTimeout(apply, 160);
}

function renderActbar(orders) {
  const bar = $('#actbar');
  if (state.tab !== 'home' || !orders.length) { bar.hidden = true; return; }
  bar.hidden = false;
  const btn = $('#actBtn');
  const ids = orders.map(o => o.ing.id);
  const approved = ids.filter(id => state.approved[id] != null);
  const pending = ids.filter(id => !state.approved[id] && !state.held[id]);
  if (approved.length) { btn.textContent = `${approved.length}건 메시지 만들기`; btn.disabled = false; btn.dataset.mode = 'msg'; }
  else if (pending.length) { btn.textContent = `${pending.length}건 모두 승인하고 메시지 만들기`; btn.disabled = false; btn.dataset.mode = 'all'; }
  else { btn.textContent = '승인한 품목이 없어요'; btn.disabled = true; btn.dataset.mode = ''; }
}

        : `<span class="is-ok">${icon('i-check')} ${won(total)} · 최소 ${won(g.s.min)}</span>`)

async function copyText(id) {
  const el = $(`#msg-${id}`);

    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('선택됐어요. 길게 눌러 복사하세요');
  }
}

function saveMessages() {
  const n = Object.keys(state.approved).length;
  Object.entries(state.approved).forEach(([id, q]) => {
    const ing = ING.find(i => i.id === id); const s = SUP[ing.sup];

    ing.onOrder = r1(ing.onOrder + q); ing.arrive = s.lead;
    HISTORY.unshift({ date: dShort(0), ing: ing.name, rec, fin: q, unit: ing.unit, sup: s.name, status: '전송 대기', note: rec === q ? '추천대로' : `수정: ${fmt(rec)} → ${fmt(q)} ${ing.unit}` });
  });
  Object.keys(state.fill).forEach(sid => {
    [['onion', 2], ['garlic', 1]].forEach(([id, q]) => { const ing = ING.find(i => i.id === id); ing.onOrder = r1(ing.onOrder + q); ing.arrive = SUP[sid].lead;
      HISTORY.unshift({ date: dShort(0), ing: ing.name, rec: 0, fin: q, unit: ing.unit, sup: SUP[sid].name, status: '전송 대기', note: '최소 주문금액 보충' }); });

  const incoming = ING.filter(i => i.onOrder > 0);
  $('#recvSub').textContent = incoming.length ? `${incoming.length}건` : '';
  $('#recvList').innerHTML = incoming.length ? incoming.map(ing => `
    <div class="line line--wide" data-recvrow="${ing.id}">
      <div class="line__a">${esc(ing.name)}</div>
      <div class="line__b">${numHTML(ing.onOrder, ing.unit)}</div>
      <div class="line__c">${esc(SUP[ing.sup].name)} · ${esc(ing.packLabel)} × ${fmt(ing.onOrder / ing.pack)}</div>
      <div class="line__d ${ing.arrive === 0 ? 'is-red' : 'is-dim'}">${ing.arrive === 0 ? '오늘 도착' : dayLabel(ing.arrive) + ' 도착'}</div>
      <div class="line__e"><button class="btn btn--ghost" data-recv="${ing.id}">입고 확인</button></div>
    </div>`).join('') : `<p class="block__empty">없음</p>`;

  $('#historyList').innerHTML = HISTORY.map(h => {
    const cls = h.status === '입고 완료' ? 'badge--ok' : (h.status === '거절' || h.status === '전송 대기') ? 'badge--dim' : 'badge--sky';
    const fin = h.status === '거절' ? '거절' : `${fmt(h.fin)} ${h.unit}`;
    return `<div class="line">
      <div class="line__a" style="font-size:15px">${esc(h.ing)} <span style="color:var(--ink-3);font-weight:500">${esc(h.date)}</span></div>
      <div class="line__b"><span class="num n14" style="color:var(--ink-3);font-weight:500">추천 ${fmt(h.rec)}</span> <span class="num n17">${esc(fin)}</span></div>
      <div class="line__c">${esc(h.sup)} · ${esc(h.note)}</div>
      <div class="line__d"><b class="badge ${cls}">${esc(h.status)}</b></div>
    </div>`;
  }).join('');

  $('#accTable tbody').innerHTML = ACC.map(([m, f, a]) => {
    const err = (f - a) / a * 100; const sign = err > 0 ? '+' : '';
    return `<tr><td>${esc(m)}</td><td class="r num n14">${f}</td><td class="r num n14">${a}</td><td class="r num n14 ${Math.abs(err) > 7 ? 'is-red' : ''}">${sign}${err.toFixed(1)}%</td></tr>`;
  }).join('');
}

function startReceive(id) {
  const ing = ING.find(i => i.id === id);
  const row = $(`[data-recvrow="${id}"]`);
  if (!row || row.querySelector('.recv')) return;
  const form = document.createElement('div');
  form.className = 'recv';
  form.innerHTML = `<input class="qty-in num n17" type="number" inputmode="decimal" step="${ing.pack}" min="0" value="${fmt(ing.onOrder)}" aria-label="받은 양 (${ing.unit})" id="recv-in-${id}">
    <span style="font-weight:700">${ing.unit}</span>
    <button class="btn btn--primary" data-recvok="${id}">${icon('i-check')}입고 완료</button>
    <button class="btn btn--quiet" data-recvcancel="${id}">취소</button>`;
  row.appendChild(form);
  form.querySelector('input').focus();
}
function finishReceive(id) {
  const ing = ING.find(i => i.id === id);
  const v = parseFloat($(`#recv-in-${id}`).value);
  if (isNaN(v) || v < 0) { toast('받은 양을 숫자로 적어 주세요'); return; }
  const ordered = ing.onOrder;
  ing.stock = r1(ing.stock + v); ing.onOrder = 0; ing.arrive = undefined;
  const h = HISTORY.find(x => x.ing === ing.name && (x.status === '입고 예정' || x.status === '전송 대기'));
  if (h) { h.status = '입고 완료'; h.note = `${dShort(0)} 입고` + (v !== ordered ? ` ${fmt(v)} ${ing.unit} (주문 ${fmt(ordered)})` : ''); }
  renderAll();
  toast(`${ing.name} 입고. 추정 재고 ${fmt(ing.stock)} ${ing.unit}`);
}

// ---------- 레시피 ----------
const unitBig = u => u === 'g' ? 'kg' : u === 'ml' ? 'L' : '개';
function renderRecipe() {
  $('#menuChips').innerHTML = MENUS.map(m => `<button class="chip" role="tab" aria-pressed="${m.id === state.menu}" data-menu="${m.id}">${esc(m.name.replace(' 파스타볼', ''))}</button>`).join('');
  const m = MENUS.find(x => x.id === state.menu);
  $('#recipeTitle').textContent = m.name;
  $('#recipeSub').textContent = won(m.price);
  const rows = Object.entries(m.recipe).map(([id, q]) => {
    const ing = ING.find(i => i.id === id);
    return `<div class="line line--wide line--tight" data-rec="${id}">
      <div class="line__a">${esc(ing.name)}</div>
      <div class="line__b"><input class="qty-in num n17" type="number" inputmode="decimal" min="0" value="${q}" aria-label="${esc(ing.name)} 1인분 양 (${ing.small})" data-recin="${id}"> <span style="font-weight:700">${ing.small}</span></div>
      <div class="line__c"></div><div class="line__d"></div>
      <div class="line__e"><button class="btn btn--quiet" data-recdel="${id}" aria-label="${esc(ing.name)} 빼기">${icon('i-x')}</button></div>
    </div>`;
  }).join('');
  $('#recipeRows').innerHTML = rows || `<p class="block__empty">재료가 없어요.</p>`;
  const free = ING.filter(i => !(i.id in m.recipe));
  $('#addSel').innerHTML = free.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('') + `<option value="__new">새 재료 직접 입력</option>`;
  syncAddRow();
}
function syncAddRow() {
  const sel = $('#addSel'); const isNew = sel.value === '__new';
  $('#addName').hidden = !isNew;
  $('#addUnit').disabled = !isNew;
  if (!isNew) $('#addUnit').value = ING.find(i => i.id === sel.value)?.small || 'g';
}
function addRecipeRow() {
  const m = MENUS.find(x => x.id === state.menu);
  const sel = $('#addSel').value, qty = parseFloat($('#addQty').value);
  if (isNaN(qty) || qty <= 0) { $('#addQty').focus(); toast('양을 적어 주세요'); return; }
  let id = sel;
  if (sel === '__new') {
    const name = $('#addName').value.trim();
    if (!name) { $('#addName').focus(); toast('재료 이름을 적어 주세요'); return; }
    const small = $('#addUnit').value;
    id = 'ing' + Date.now();
    ING.push({ id, name, unit: unitBig(small), small, stock: 0, onOrder: 0, daily: [0,0,0,0,0,0,0], safetyDays: 1, sup: 'fresh', pack: 1, packLabel: `1 ${unitBig(small)}`, price: 0, max: 100 });
    state.qty[id] = 0;
  }
  m.recipe[id] = qty;
  $('#addQty').value = ''; $('#addName').value = '';
  renderRecipe(); renderHome(); renderSettings();
  toast(`${ING.find(i => i.id === id).name} 추가`);
}

// ---------- 거래처와 재료 ----------
function renderSettings() {
  const sups = Object.values(SUP);
  $('#supCount').textContent = `${sups.length}곳`;
  $('#supplierList').innerHTML = sups.map(s => `
    <details class="row" data-sup="${s.id}">
      <summary>
        <span class="row__name">${esc(s.name)}</span>
        <span class="row__qty"><span class="num n17">${s.lead}<span class="unit">일</span></span></span>
        <span class="row__meta">${esc(s.channel)} · 마감 ${s.cutoff} · 배송 ${esc(s.days)}</span>
        <span class="row__state" style="color:var(--ink-3);font-weight:500">리드타임</span>
      </summary>
      <div class="row__body">
        <div class="grid2">
          <label class="field"><span>주문 방법</span><select><option ${s.channel==='카톡'?'selected':''}>카톡</option><option ${s.channel==='앱 주문'?'selected':''}>앱 주문</option><option>전화</option><option>문자</option><option>이메일</option></select></label>
          <label class="field"><span>주문 마감</span><input type="time" value="${s.cutoff}"></label>
          <label class="field"><span>리드타임 (일)</span><input type="number" min="0" value="${s.lead}"></label>
          <label class="field"><span>발주 주기 (일)</span><input type="number" min="1" value="${s.cycle}"></label>
          <label class="field"><span>배송 요일</span><input type="text" value="${esc(s.days)}"></label>
          <label class="field"><span>최소 주문금액 (원)</span><input type="number" min="0" step="1000" value="${s.min}"></label>
        </div>
        <label class="field"><span>주문 메시지</span><textarea>${esc(s.template)}</textarea></label>
        <div class="actions"><button class="btn btn--primary" data-supsave="${s.id}">저장</button></div>
      </div>
    </details>`).join('');

  $('#ingCountSub').textContent = `${ING.length}개`;
  $('#ingTable tbody').innerHTML = ING.map(ing => {
    const p = plan(ing);
    return `<tr>
      <td>${esc(ing.name)}</td>
      <td class="r num n14">${fmt(ing.stock)} ${ing.unit}</td>
      <td class="r"><span class="num n14">${fmt(p.safety)} ${ing.unit}</span> <span style="color:var(--ink-3)">${ing.safetyDays}일</span></td>
      <td class="r num n14">${fmt(ing.max)} ${ing.unit}</td>
      <td>${esc(SUP[ing.sup].name)} · ${esc(ing.packLabel)}${ing.price ? ' · ' + won(ing.price) + '/' + ing.unit : ''}</td>
    </tr>`;
  }).join('');
}

// ---------- 업로드 ----------
function renderUpload() {
  $('#mapCount').textContent = UNMAPPED.length;
  $('#mapList').innerHTML = UNMAPPED.length ? UNMAPPED.map((u, i) => `
    <div class="line line--wide line--tight">
      <div class="line__a">“${esc(u.pos)}”</div>
      <div class="line__b"></div><div class="line__c"></div><div class="line__d"></div>
      <div class="line__e"><select class="sel" data-map="${i}" aria-label="${esc(u.pos)}을 연결할 메뉴" style="min-width:200px">${MENUS.map(m => `<option value="${m.id}" ${m.id === u.guess ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}<option value="skip">추적 안 함</option></select></div>
    </div>`).join('') : `<p class="block__empty">모두 연결됐어요.</p>`;
  $('#mapSave').hidden = !UNMAPPED.length;
  $('#uploadList').innerHTML = UPLOADS.map(u => `
    <div class="line line--tight">
      <div class="line__a">${esc(u.file)}</div>
      <div class="line__b num n17">${u.rows.toLocaleString('ko-KR')}<span class="unit">행</span></div>
      <div class="line__c">${esc(u.date)}</div>
      <div class="line__d ${u.ok ? 'is-ok' : 'is-dim'}">${u.ok ? '반영 완료' : '처리 중'}</div>
    </div>`).join('');
}

// ---------- 공통 ----------
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('is-on'), 2400);
}
function go(tab) {
  state.tab = tab;
  $$('.screen').forEach(s => { s.hidden = s.id !== 's-' + tab; });
  $$('.tab').forEach(b => { if (b.dataset.go === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderActbar(ordersNow());
  if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
  window.scrollTo({ top: 0 });
}
function renderAll() { renderHome(); renderReceive(); renderRecipe(); renderSettings(); renderUpload(); }

// ---------- 이벤트 ----------
document.addEventListener('click', e => {
  const sm = e.target.closest('#orderList summary');
  if (sm && matchMedia('(min-width:900px)').matches) {
    e.preventDefault();
    state.selected = sm.parentElement.dataset.id;
    $$('#orderList .row').forEach(r => r.classList.toggle('is-selected', r.dataset.id === state.selected));
    renderDetail();
    return;
  }
  const t = e.target.closest('[data-go],[data-step],[data-approve],[data-hold],[data-recv],[data-recvok],[data-recvcancel],[data-copy],[data-fill],[data-menu],[data-recdel],[data-supsave],#actBtn,#msgClose,#msgSave,#mapSave');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.step) {
    const id = t.closest('[data-stepper]').dataset.stepper; const ing = ING.find(i => i.id === id);
    state.qty[id] = r1(Math.min(ing.max, Math.max(ing.pack, state.qty[id] + ing.pack * Number(t.dataset.step))));
    patchRow(id, true); return;
  }
  if (t.dataset.approve) { const id = t.dataset.approve; state.approved[id] = state.qty[id]; delete state.held[id]; patchRow(id, e.detail === 0); toast(`${ING.find(i => i.id === id).name} ${fmt(state.qty[id])} 승인`); return; }
  if (t.dataset.hold) { const id = t.dataset.hold; if (state.held[id]) delete state.held[id]; else { state.held[id] = true; delete state.approved[id]; } patchRow(id, e.detail === 0); return; }
  if (t.dataset.recv) return startReceive(t.dataset.recv);
  if (t.dataset.recvok) return finishReceive(t.dataset.recvok);
  if (t.dataset.recvcancel) { t.closest('.recv').remove(); return; }
  if (t.dataset.copy) return copyText(t.dataset.copy);
  if (t.dataset.fill) { state.fill[t.dataset.fill] = true; openMessages(); return; }
  if (t.dataset.menu) { state.menu = t.dataset.menu; renderRecipe(); return; }
  if (t.dataset.recdel) { const m = MENUS.find(x => x.id === state.menu); delete m.recipe[t.dataset.recdel]; renderRecipe(); renderHome(); return; }
  if (t.dataset.supsave) { toast('저장했어요'); return; }
  if (t.id === 'actBtn') {
    if (t.dataset.mode === 'all') { ING.forEach(i => { if (plan(i).status === 'order' && !state.held[i.id]) state.approved[i.id] = state.qty[i.id]; }); renderHome(); }
    openMessages(); return;
  }
  if (t.id === 'msgClose') { $('#msgDialog').close(); return; }
  if (t.id === 'msgSave') return saveMessages();
  if (t.id === 'mapSave') { UNMAPPED.length = 0; renderUpload(); toast('연결했어요'); return; }
});
$('#addForm').addEventListener('submit', e => { e.preventDefault(); addRecipeRow(); });
document.addEventListener('change', e => {
  const inp = e.target;
  if (inp.id === 'addSel') { syncAddRow(); if (inp.value === '__new') $('#addName').focus(); return; }
  if (inp.dataset.recin) {
    const m = MENUS.find(x => x.id === state.menu); const v = parseFloat(inp.value);
    if (!isNaN(v) && v >= 0) { m.recipe[inp.dataset.recin] = v; renderHome(); }
    return;
  }
  if (inp.id === 'fileIn' && inp.files && inp.files[0]) {
    const f = inp.files[0];
    UPLOADS.unshift({ date: `${dShort(0)} 지금`, file: f.name, rows: 1188, ok: false });
    renderUpload(); toast(`${f.name} 올렸어요`);
    setTimeout(() => { UPLOADS[0].ok = true; renderUpload(); }, 1400);
  }
});
$('#msgDialog').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

// ---------- 시작 ----------
$('#todayLabel').textContent = `${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${dName(0)}요일`;
renderAll();
const first = ['home','receive','recipe','settings','upload'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
go(first);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['home','receive','recipe','settings','upload'].includes(h) && h !== state.tab) go(h); });
})();
</script>

</body>
</html>
