<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지그재고 거래처 · 재료 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend:wght@300;400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* frontend/src/styles/tokens.css 값 그대로 */
:root{
  --ground:#f3f1ec;--glow:#f7d9d6;--paper:#fff;--paper-2:rgba(29,29,27,.06);
  --ink:#1d1d1b;--ink-2:#4a4a46;--ink-3:#85847e;--ink-4:#9d9c96;--ink-5:#b9b8b2;
  --rule:rgba(29,29,27,.09);--rule-soft:rgba(29,29,27,.05);
  --dark:#262624;--red:#cf2229;--red-deep:#b31b21;--red-tint:#fdecec;--red-art:#e79094;
  --ok-text:#1a7f4b;--scrim:rgba(25,25,23,.45);
  --font:"Noto Sans KR",system-ui,sans-serif;--numeral:"Lexend","Noto Sans KR",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  /* 그림 색 */
  --steel:#e6e4de;--steel-2:#d6d3cb;--wood:#b98a5a;--wood-2:#9a6f45;--roof:#3a3936;
}
*{box-sizing:border-box;margin:0}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:var(--ground);
  background-image:radial-gradient(1100px 680px at 100% 0%,var(--glow),transparent 62%);
  min-height:100dvh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.num{font-family:var(--numeral);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1360px;margin:0 auto;padding:20px 28px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;flex:none}
.logo img{width:34px;height:34px}
.nav{display:flex;gap:4px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:9px 18px;border-radius:999px;font-size:14px;color:var(--ink-2);white-space:nowrap;cursor:pointer;text-decoration:none}
.nav a.on{background:var(--dark);color:#fff}
h1{margin:40px 0 28px;font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1.05}
.view{display:none}
.view.on{display:block}

/* ───────── 그림 공통: 로고(logo.png)와 같은 그림체. 빨간 굵은 선 · 흰 면 · 앞면 + 윗면 + 오른쪽 옆면 ───────── */
:root{--dx:26px;--dy:18px;--hand:"Jua","Noto Sans KR",sans-serif}
.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.ln path,.ln rect,.ln circle,.ln line{stroke:var(--red-art);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;fill:#fff}
.ln .fill{fill:var(--red-art)}
.ln .thin{stroke-width:3}
.ln .no{fill:none}

/* ───────── 거래처: 가게 ───────── */
.street{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:34px 26px;align-items:start}
.shop{display:flex;flex-direction:column;text-align:center;transition:transform 180ms var(--ease-out)}
.shop:active{transform:scale(.97)}
.front{position:relative;transition:transform 240ms var(--ease-out)}
@media (hover:hover){.shop:hover .front{transform:translateY(-4px) rotate(-1deg)}}
.front > svg{display:block;width:100%;height:auto;overflow:visible}
.front > svg *{stroke:var(--red);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;fill:#fff}
.front > svg .fill{fill:var(--red)}
.front > svg .no{fill:none}
/* 간판 글자: SVG 간판(x 30~180, y 62~104 / 240×224) */
.sign{position:absolute;left:12.5%;width:62.5%;top:27.7%;height:18.8%;display:grid;place-items:center;padding:0 8px;
  font-family:var(--hand);font-size:clamp(17px,1.9vw,23px);color:var(--red);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:0 8px;margin-top:8px;font-size:13px;color:var(--ink-3)}
.meta span + span::before{content:"·";margin-right:8px}
.shop.add .front > svg *{stroke:var(--ink-5);stroke-dasharray:7 7}
.shop.add .front > svg .fill{fill:#fff}
.shop.add .sign{color:var(--ink-4)}
.plus{position:absolute;left:44%;top:76%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  border:3px solid var(--ink-4);background:#fff;display:grid;place-items:center}
.plus svg{width:20px;height:20px;stroke:var(--ink-3);stroke-width:2.6;fill:none;stroke-linecap:round}

/* ───────── 재료 ───────── */
.store{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:30px;align-items:start}
.right{display:grid;gap:30px}
.fx-name{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.ih1{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:40px 0 28px}
.ih1 h1{margin:0}
.find{display:flex;align-items:center;gap:8px;width:min(320px,100%);height:48px;padding:0 16px;border-radius:999px;background:var(--paper);
  box-shadow:0 0 0 2px transparent;transition:box-shadow 160ms ease}
.find:focus-within{box-shadow:0 0 0 2px var(--red)}
.find svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:2.2;stroke-linecap:round}
.find input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
/* 쪽 넘김: 그림마다 오른쪽 위 */
.pgw{margin-left:auto}
.pg{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--ink-3)}
.pg button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:background-color 120ms ease,transform 120ms var(--ease-out)}
.pg button:active{transform:scale(.9)}
@media (hover:hover){.pg button:hover:not(:disabled){background:var(--red-tint)}}
.pg button:disabled{opacity:.3;cursor:default}
.pg svg{width:16px;height:16px;fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pg .num{min-width:34px;text-align:center}
.cmp .pgw{position:absolute;right:0;top:0}
.none{padding:6px 10px;font-size:14px;color:var(--ink-4)}
[hidden]{display:none!important}
/* 보기 전환 */
.hl{display:flex;align-items:center;gap:18px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper)}
.seg button{height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-3);transition:background-color 160ms ease,color 160ms ease}
.seg button[aria-pressed=true]{background:var(--dark);color:#fff}
/* 표 */
.tbl{background:var(--paper);border-radius:24px;padding:6px 8px;overflow-x:auto}
.tbl table{width:100%;min-width:680px;border-collapse:collapse}
.tbl th{padding:12px 14px;font-size:13px;font-weight:500;color:var(--ink-3);text-align:left;white-space:nowrap}
.tbl td{padding:14px;border-top:1px solid var(--rule);font-size:15px;white-space:nowrap}
.tbl td b{font-weight:600}
.tbl .r{text-align:right}
.tbl td.num{font-size:16px}
.tbl td small{font-family:var(--font);font-size:12px;color:var(--ink-3)}
.tbl tr.row{cursor:pointer}
@media (hover:hover){.tbl tr.row:hover td{background:var(--rule-soft)}}
.tbl tr.low td.q{color:var(--red)}
.loc{display:inline-flex;height:24px;padding:0 9px;align-items:center;border-radius:999px;border:1.5px solid var(--red);color:var(--red);font-size:12px;font-weight:600}
.tpg{display:flex;justify-content:center;padding:14px 0}
.pn{display:flex;align-items:center;gap:4px}
.pn button{min-width:38px;height:38px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:15px;color:var(--ink-2);
  transition:background-color 120ms ease,transform 120ms var(--ease-out)}
.pn button:active{transform:scale(.92)}
@media (hover:hover){.pn button:hover:not(:disabled):not([aria-current]){background:var(--paper)}}
.pn button[aria-current]{background:var(--red);color:#fff}
.pn button:disabled{opacity:.3;cursor:default}
.pn svg{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* 끌어서 옮기기 */
[data-drop]{border-radius:14px;transition:background-color 140ms ease,box-shadow 140ms ease}
[data-drop].over{background:rgba(207,34,41,.07);box-shadow:0 0 0 2px rgba(207,34,41,.35)}
.it.lift{opacity:.25}
.it.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;background:#fff;transition:none;
  box-shadow:0 0 0 3px var(--red),0 16px 30px -10px rgba(29,29,27,.4);transform:rotate(-3deg) scale(1.05)}
body.dragging{cursor:grabbing;user-select:none}
@media (hover:hover){.it{cursor:grab}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;padding:12px 18px;border-radius:999px;background:var(--dark);color:#fff;font-size:14px}
.fx-name h2{font-family:var(--hand);font-weight:400;font-size:22px;color:var(--red)}
.fx-name .num{color:var(--ink-3);font-size:15px}
.obj{position:relative;padding:var(--dy) var(--dx) 0 0}
.face{position:relative;z-index:1}

/* 그림 안의 재료: 카드 없이 글자만 */
.it{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-width:0;height:56px;padding:0 10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:12px;text-align:left;
  transition:background-color 140ms ease,transform 160ms var(--ease-out)}
.it:active{transform:scale(.96)}
@media (hover:hover){.it:hover{background:var(--red-tint)}}
.it b{font-size:14px;font-weight:600;color:var(--ink-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .num{font-size:21px;line-height:1.2}
.it .num small{font-family:var(--font);font-size:12px;color:var(--ink-3);margin-left:2px}
.it.low .num{color:var(--red)}
.it.unk .num{color:var(--ink-4)}
.rack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.rack.c3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* 냉장고: 위 냉동 · 아래 냉장 두 문, 오른쪽 끝 손잡이, 아래 다리 */
.obj.fridge{padding-bottom:14px}
.fridge .face{padding:12px 40px 12px 14px}
.cmp{position:relative;padding:30px 0 6px}
.cmp + .cmp{margin-top:22px}
.cl{position:absolute;left:10px;top:4px;font-family:var(--hand);font-size:16px;color:var(--red)}
.cl .num{font-family:var(--numeral);font-size:13px;margin-left:4px}
/* 데스크톱: 냉장고는 선반 맨 위 ~ 창고 맨 아래 (높이는 JS 가 맞춘다). 남는 높이는 냉장칸이 갖는다 */
.fridge .face{display:flex;flex-direction:column}
.cmp:last-child{flex:1}

/* 선반: 기둥 둘 · 판 위에 재료 */
.shelf .face{padding:20px 20px 0}
.plank{padding:6px 4px calc(var(--dy) + 6px)}
.plank .rack{min-height:56px}
.plank + .plank{margin-top:16px}
.obj.shelf{padding-bottom:28px}

/* 창고: 박공 지붕 + 반쯤 올린 셔터 */
.shed .face{margin-top:62px;padding:12px 16px 16px}
.bay{position:relative;padding:44px 10px 10px}
.bay .rack{position:relative;z-index:1;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
/* ───────── 모달 ───────── */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out);
  display:grid;place-items:center;padding:24px}
.scrim.on{opacity:1;pointer-events:auto}
.modal{width:min(780px,100%);max-height:min(860px,calc(100dvh - 48px));overflow:auto;overscroll-behavior:contain;scrollbar-width:none;
  background:var(--ground);border-radius:30px;transform:scale(.96);opacity:0;
  transition:transform 240ms var(--ease-out),opacity 200ms var(--ease-out)}
.scrim.on .modal{transform:none;opacity:1}
.mh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:22px 24px 14px;background:var(--ground)}
.mh h2{flex:1;font-size:26px;font-weight:600;letter-spacing:-.03em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);font-size:13px;color:var(--ink-2);flex:none}
.x{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;transition:transform 120ms var(--ease-out)}
.x:active{transform:scale(.92)}
.x svg{width:18px;height:18px;stroke:var(--ink-2);stroke-width:2.2;fill:none;stroke-linecap:round}
.mb{padding:0 24px 24px;display:grid;gap:12px}
.blk{background:var(--paper);border-radius:22px;padding:18px 20px}
.blk h3{font-size:14px;font-weight:600;color:var(--ink-3);margin-bottom:8px}

/* 재고 블록: 큰 숫자 + 실사 입력 */
.stock{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stock .lb{font-size:13px;color:var(--ink-3)}
.stock .v{font-size:56px;font-weight:300;line-height:1.05}
.stock .v small{font-family:var(--font);font-size:18px;color:var(--ink-3);margin-left:4px}
.stock .v.low{color:var(--red)}
.stock .when{font-size:13px;color:var(--ink-3)}
.btn{height:46px;padding:0 20px;border-radius:999px;background:var(--dark);color:#fff;font-weight:600;transition:transform 140ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.cnt{display:none;align-items:center;gap:8px;width:100%;margin-top:14px}
.blk.counting .cnt{display:flex}
.blk.counting .count-open{display:none}
.cnt input{flex:1;min-width:0;height:52px;border:1px solid var(--rule);border-radius:14px;background:var(--ground);padding:0 16px;
  font-family:var(--numeral);font-size:24px;text-align:right;outline:none}
.cnt input:focus{border-color:var(--ink)}
.cnt .u{font-size:15px;color:var(--ink-3);margin-right:4px}
.step{width:46px;height:46px;border-radius:50%;background:var(--ground);font-size:22px;flex:none;transition:transform 120ms var(--ease-out)}
.step:active{transform:scale(.92)}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
.kv div{min-width:0}
.kv dt{font-size:13px;color:var(--ink-3)}
.kv dd{font-size:17px;font-weight:600;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv dd.num{font-weight:400;font-size:19px}

.bars{display:flex;align-items:flex-end;gap:8px;height:128px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:36px;border-radius:6px;background:var(--ink-5);transform-origin:bottom;animation:grow 420ms var(--ease-out) both}
.bars div:last-child i{background:var(--dark)}
.bars span{font-size:11px;color:var(--ink-4)}
.bars em{font-style:normal;font-size:12px;color:var(--ink-2);white-space:nowrap}
.bars em small{font-family:var(--font);font-size:10px;color:var(--ink-3);margin-left:1px}
@keyframes grow{from{transform:scaleY(0)}}

.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--rule)}
.rows .r:first-of-type{border-top:0}
.rows .r b{font-size:16px;font-weight:600}
.rows .r small{display:block;font-size:13px;color:var(--ink-3)}
.rows .r .num{font-size:16px;text-align:right}
.rows .r .d{font-size:13px;color:var(--ink-3);text-align:right;min-width:74px}
.msg{white-space:pre-line;font-size:15px;color:var(--ink-2);background:var(--ground);border-radius:14px;padding:12px 14px}

/* 거래처 폼 (추가 · 고치기) */
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--ink-3)}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{height:48px;border:1px solid var(--rule);border-radius:14px;background:var(--paper);padding:0 14px;font:inherit;color:var(--ink);outline:none}
.form textarea{height:auto;padding:12px 14px;resize:vertical}
.ed{width:100%;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--ground);padding:0 10px;
  font:inherit;font-size:16px;font-weight:600;color:var(--ink);outline:none;transition:border-color 120ms ease}
.ed:focus{border-color:var(--red)}
.ed.num{font-family:var(--numeral);font-weight:400}
.edw{display:flex;align-items:center;gap:6px}
.edw small{font-size:14px;font-weight:500;color:var(--ink-3);flex:none}
.mh .ed.name{flex:1;min-width:0;height:44px;font-size:24px;letter-spacing:-.03em}
textarea.ed.msg{height:auto;padding:12px 14px;font-weight:400;font-size:15px;resize:vertical;display:block}
.acts .grow{flex:1}
.acts .del{color:var(--red)}
.rows h3{display:flex;justify-content:space-between}
.rows h3 span{font-weight:400;color:var(--ink-4);font-size:13px}
.days{display:flex;gap:4px;flex-wrap:nowrap}
.kv .wide2{grid-column:span 2}
.days button{width:30px;height:30px;border-radius:50%;background:var(--ground);border:1px solid var(--rule);font-size:13px;font-weight:600;color:var(--ink-2)}
.days button[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:#fff}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

@media (max-width:820px){
  .wrap{padding:14px 16px 60px}
  .top{flex-direction:column;align-items:flex-start}
  .nav{max-width:100%}
  h1{font-size:38px;margin:24px 0 18px}
  .street{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  .sign{font-size:14px}
  .meta{font-size:12px;gap:0 6px}
  .meta span + span::before{margin-right:6px}
  .store{grid-template-columns:minmax(0,1fr)}
  .rack.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ih1{flex-direction:column;align-items:stretch;margin:24px 0 18px}
  .hl{justify-content:space-between}
  .find{width:100%}
  :root{--dx:18px;--dy:13px}
  .scrim{padding:12px;align-items:end}
  .modal{max-height:calc(100dvh - 24px);border-radius:26px}
  .mh{padding:18px 18px 12px}.mh h2{font-size:22px}
  .mb{padding:0 12px 12px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stock .v{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* DECISIONS #100: 일반 보관 이름은 중립색, 부족 경고는 red 유지 */
.fx-name h2,.cl{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><img src="../../../frontend/public/logo.png" alt="">지그재고</div>
    <nav class="nav">
      <a>홈</a><a>발주</a><a>발주 이력</a><a>레시피</a>
      <a data-v="sup" class="on">거래처</a><a data-v="ing">재료</a><a>더보기</a>
    </nav>
  </header>

  <section class="view on" id="sup">
    <h1>거래처</h1>
    <div class="street" id="street"></div>
  </section>

  <section class="view" id="ing">
    <div class="ih1"><div class="hl"><h1>재료</h1>
      <div class="seg" role="group" aria-label="보기"><button data-mode="pic" aria-pressed="true">그림</button><button data-mode="tbl" aria-pressed="false">표</button></div></div>
      <label class="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="재료 찾기" aria-label="재료 찾기" autocomplete="off"></label></div>
    <div class="tblw" id="tbl" hidden>
      <div class="tbl"><table>

/* ── 재료 그림: 글자 칸(.face)을 재서 그 둘레에 로고 같은 선을 그린다 ── */
const tile=x=>{
  const low=x.q!==null&&x.q<x.safe, unk=x.q===null;
  return `<button class="it${low?" low":""}${unk?" unk":""}" data-i="${x.id}"><b>${x.n}</b>
    <span class="num">${unk?"–":fmt(x.q)}<small>${x.u}</small></span></button>`;
};
// 모자란 것 · 모르는 것을 앞에 (딱지 대신 순서)
const order=a=>[...a].sort((p,q)=>rank(p)-rank(q));
const rank=x=>x.q===null?0:x.q<x.safe?1:2;
const SMALL=matchMedia("(max-width:820px)");
let DX=26, DY=18;
const depth=()=>{DX=SMALL.matches?18:26;DY=SMALL.matches?13:18;};
const P=(...pts)=>`<path d="M${pts.map(p=>p.join(" ")).join("L")}Z"/>`;
const L=(cls,...pts)=>`<path class="no ${cls}" d="M${pts.map(p=>p.join(" ")).join("L")}"/>`;
// 상자: 윗면 · 옆면 · 앞면
const box=(x,y,w,h)=>P([x,y],[x+DX,y-DY],[x+w+DX,y-DY],[x+w,y])+P([x+w,y],[x+w+DX,y-DY],[x+w+DX,y+h-DY],[x+w,y+h])+P([x,y],[x+w,y],[x+w,y+h],[x,y+h]);
const off=(el,root)=>{const a=el.getBoundingClientRect(),b=root.getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};};

const DRAW={
  fridge(root,f){
    let s=box(f.x,f.y,f.w,f.h);
    const cs=[...root.querySelectorAll(".cmp")].map(c=>off(c,root));
    // 두 문 사이 금 + 문마다 손잡이
    for(let i=1;i<cs.length;i++){const y=(cs[i-1].y+cs[i-1].h+cs[i].y)/2;s+=L("",[f.x,y],[f.x+f.w,y])+L("",[f.x+f.w,y],[f.x+f.w+DX,y-DY]);}
    cs.forEach(c=>{const hx=f.x+f.w-18, hy=c.y+18;s+=L("",[hx,hy],[hx,hy+Math.min(70,c.h*.45)]);});
    // 다리
    s+=`<rect x="${f.x+18}" y="${f.y+f.h}" width="22" height="10" rx="3"/><rect x="${f.x+f.w-40}" y="${f.y+f.h}" width="22" height="10" rx="3"/>`;
    return s;
  },
  shelf(root,f){
    let s="";
    const ps=[...root.querySelectorAll(".plank")].map(p=>off(p,root));
    const T=12;
    ps.forEach(p=>{const y=p.y+p.h;
      s+=P([f.x,y],[f.x+DX,y-DY],[f.x+f.w+DX,y-DY],[f.x+f.w,y])+P([f.x+f.w,y],[f.x+f.w+DX,y-DY],[f.x+f.w+DX,y-DY+T],[f.x+f.w,y+T])+P([f.x,y],[f.x+f.w,y],[f.x+f.w,y+T],[f.x,y+T]);});
    // 맨 위 판
    s+=P([f.x,f.y],[f.x+DX,f.y-DY],[f.x+f.w+DX,f.y-DY],[f.x+f.w,f.y])+P([f.x+f.w,f.y],[f.x+f.w+DX,f.y-DY],[f.x+f.w+DX,f.y-DY+T],[f.x+f.w,f.y+T])+P([f.x,f.y],[f.x+f.w,f.y],[f.x+f.w,f.y+T],[f.x,f.y+T]);
    const top=f.y+T, bot=ps.length?ps.at(-1).y+ps.at(-1).h+T+16:f.y+f.h;
    // 기둥 (앞 왼쪽 · 앞 오른쪽 + 옆면)
    s+=P([f.x,top],[f.x+12,top],[f.x+12,bot],[f.x,bot]);
    s+=P([f.x+f.w-12,top],[f.x+f.w,top],[f.x+f.w,bot],[f.x+f.w-12,bot])+P([f.x+f.w,top],[f.x+f.w+DX,top-DY],[f.x+f.w+DX,bot-DY],[f.x+f.w,bot]);
    return s;
  },
  shed(root,f){
    const R=62, x=f.x, y=f.y, w=f.w, h=f.h;
    // 지붕 옆면 · 벽 옆면 · 박공 앞면
    let s=P([x,y],[x+w/2,y-R],[x+w/2+DX,y-R-DY],[x+DX,y-DY]);
    s+=P([x+w/2,y-R],[x+w/2+DX,y-R-DY],[x+w+DX,y-DY],[x+w,y]);
    s+=P([x+w,y],[x+w+DX,y-DY],[x+w+DX,y+h-DY],[x+w,y+h]);
    s+=P([x,y],[x+w/2,y-R],[x+w,y],[x+w,y+h],[x,y+h]);
    s+=`<circle cx="${x+w/2}" cy="${y-R*.42}" r="9"/>`+L("thin",[x+w/2-9,y-R*.42],[x+w/2+9,y-R*.42])+L("thin",[x+w/2,y-R*.42-9],[x+w/2,y-R*.42+9]);
    // 셔터: 위 세 줄은 반쯤 내린 셔터
    const b=off(root.querySelector(".bay"),root);
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/>`;
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="34" rx="6"/>`;
    [11,22].forEach(d=>s+=L("thin",[b.x+6,b.y+d],[b.x+b.w-6,b.y+d]));
    s+=`<rect x="${b.x+b.w/2-12}" y="${b.y+26}" width="24" height="5" rx="2.5" class="fill"/>`;
    return s;
  },
};
function draw(){

    const face=root.querySelector(".face");

    if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","ln");root.prepend(svg);}

  });
}

// ── 쪽 넘김: 프론트에서 자른다. 쪽 크기는 그림 칸에 꼭 맞게 화면 폭 · 높이로 계산 ──
// 선반 · 창고 = 2줄 × (폭에 들어가는 칸 수). 냉장고 = 데스크톱에서 선반 맨 위 ~ 창고 맨 아래 높이에 들어가는 줄 수
const ROW=56, GAP=4, MINW={fridge:104,shelf:112,shed:112};
const KEY={냉동:"frz",냉장:"chl",선반:"shelf",창고:"shed"};
const API_LOC={냉동:"FREEZER",냉장:"FRIDGE",선반:"SHELF",창고:"WAREHOUSE"};
const SIZE={frz:4,chl:8,shelf:6,shed:6}, COLS={frz:2,chl:2,shelf:3,shed:3};
const page={frz:0,chl:0,shelf:0,shed:0,tbl:0};
let query="", mode="pic";
const PREV=`<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>`, NEXT=`<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`;
const DESK=matchMedia("(min-width:821px)");
const colsIn=(el,min)=>{const cs=getComputedStyle(el);const w=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);return Math.max(1,Math.floor((w+GAP)/(min+GAP)));};

function pager(key,n){
  return n>1?`<span class="pg"><button data-p="${key}" data-d="-1" aria-label="이전" ${page[key]?"":"disabled"}>${PREV}</button><span class="num">${page[key]+1}/${n}</span><button data-p="${key}" data-d="1" aria-label="다음" ${page[key]<n-1?"":"disabled"}>${NEXT}</button></span>`:"";
}
function slice(key,list){
  const n=Math.max(1,Math.ceil(list.length/SIZE[key]));
  page[key]=Math.min(page[key],n-1);
  document.querySelector(`.pgw[data-w="${key}"]`).innerHTML=pager(key,n);
  return list.slice(page[key]*SIZE[key],(page[key]+1)*SIZE[key]);
}
const grid=(key,items)=>`<div class="rack" style="grid-template-columns:repeat(${COLS[key]},minmax(0,1fr))">${items.map(tile).join("")}</div>`;
const NONE=`<div class="none">없음</div>`;
const hit=x=>!query||x.n.replace(/\s/g,"").includes(query);
const at=k=>order(ING.filter(x=>x.at===k&&hit(x)));

function renderStore(){
  if(mode==="tbl")return renderTable();
  // 1) 선반 · 창고: 폭으로 칸 수, 2줄 고정. 위 판부터 채운다
  COLS.shelf=colsIn($("#shelf"),MINW.shelf)||3; SIZE.shelf=COLS.shelf*2;
  COLS.shed=colsIn($("#shedBay"),MINW.shed)||3; SIZE.shed=COLS.shed*2;
  const s=at("선반"), h=at("창고");
  const sp=slice("shelf",s);
  $("#shelf").innerHTML=[0,1].map(r=>`<div class="plank">${r===0&&!s.length?NONE:grid("shelf",sp.slice(r*COLS.shelf,(r+1)*COLS.shelf))}</div>`).join("");
  $("#shed").innerHTML=h.length?slice("shed",h).map(tile).join(""):(slice("shed",h),NONE);
  $("#shed").style.gridTemplateColumns=`repeat(${COLS.shed},minmax(0,1fr))`;
  $("#shed").style.minHeight=`${ROW*2+GAP}px`;
  // 2) 냉장고: 데스크톱이면 선반 맨 위 ~ 창고 맨 아래에 높이를 맞추고, 그 안에 들어가는 줄 수만큼
  const face=$("#fridgeFace"), cols=colsIn($("#frz").parentElement,MINW.fridge);
  COLS.frz=COLS.chl=cols;
  let rf=2, rc=4;
  if(DESK.matches){
    const bottom=$(".obj.shed").getBoundingClientRect().bottom, top=face.getBoundingClientRect().top;
    const hFace=Math.max(200,bottom-top-14);  // 14 = 다리
    face.style.height=hFace+"px";
    const rows=Math.max(2,Math.floor((hFace-24-36*2-22+GAP*2)/(ROW+GAP)));
    rf=Math.max(1,Math.round(rows/3)); rc=Math.max(1,rows-rf);
  }else face.style.height="";
  SIZE.frz=cols*rf; SIZE.chl=cols*rc;
  const f=at("냉동"), c=at("냉장");
  $("#frz").innerHTML=f.length?grid("frz",slice("frz",f)):(slice("frz",f),NONE);
  $("#chl").innerHTML=c.length?grid("chl",slice("chl",c)):(slice("chl",c),NONE);
  $("#n-fridge").textContent=f.length+c.length;
  $("#n-shelf").textContent=s.length;
  $("#n-shed").textContent=h.length;
  requestAnimationFrame(draw);
}

const TBL=10;

  const all=order(ING.filter(hit));
  const n=Math.max(1,Math.ceil(all.length/TBL)); page.tbl=Math.min(page.tbl,n-1);
  const rows=all.slice(page.tbl*TBL,(page.tbl+1)*TBL);
  $("#tblBody").innerHTML=rows.length?rows.map(x=>{

    return `<tr class="row${low?" low":""}" data-i="${x.id}" tabindex="0">
      <td><b>${x.n}</b></td><td><span class="loc">${x.at}</span></td>
      <td class="r num q">${x.q===null?"–":fmt(x.q)} <small>${x.u}</small></td>
      <td class="r num">${fmt(x.safe)} <small>${x.u}</small></td>
      <td class="r num">${fmt(x.day)} <small>${x.u}</small></td>

  const from=Math.max(0,Math.min(page.tbl-2,n-5)), nums=Array.from({length:Math.min(5,n)},(_,k)=>from+k);
  $("#tblPg").innerHTML=n>1?`<nav class="pn" aria-label="쪽"><button data-p="tbl" data-d="-1" aria-label="이전" ${page.tbl?"":"disabled"}>${PREV}</button>${nums.map(k=>`<button data-go="${k}" class="num" ${k===page.tbl?'aria-current="page"':""}>${k+1}</button>`).join("")}<button data-p="tbl" data-d="1" aria-label="다음" ${page.tbl<n-1?"":"disabled"}>${NEXT}</button></nav>`:"";
}

// ── 끌어서 옮기기: 마우스는 6px 움직이면, 터치는 0.35초 누르고 있으면 시작 ──
// 놓으면 바로 PATCH /ingredients/{id} {storageLocation}. 실패하면 되돌린다
let drag=null, justDragged=false;
function startDrag(d){
  const r=d.el.getBoundingClientRect();
  d.ghost=d.el.cloneNode(true); d.ghost.classList.add("ghost");
  Object.assign(d.ghost.style,{width:r.width+"px",height:r.height+"px",left:r.left+"px",top:r.top+"px"});
  d.dx=d.x-r.left; d.dy=d.y-r.top;
  document.body.append(d.ghost); d.el.classList.add("lift"); document.body.classList.add("dragging");
  d.on=true; navigator.vibrate?.(10);
}
function zoneAt(x,y){return document.elementFromPoint(x,y)?.closest("[data-drop]")??null;}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".it");if(!el||e.button>0)return;
  drag={el,id:el.dataset.i,x:e.clientX,y:e.clientY,touch:e.pointerType!=="mouse",on:false,zone:null};
  if(drag.touch)drag.timer=setTimeout(()=>drag&&startDrag(drag),350);
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  const moved=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(!drag.on){
    if(drag.touch){if(moved>8){clearTimeout(drag.timer);drag=null;}return;}
    if(moved<6)return; startDrag(drag);
  }
  drag.ghost.style.left=e.clientX-drag.dx+"px"; drag.ghost.style.top=e.clientY-drag.dy+"px";
  const z=zoneAt(e.clientX,e.clientY);
  if(z!==drag.zone){drag.zone?.classList.remove("over");z?.classList.add("over");drag.zone=z;}
});
// 길게 누른 뒤에는 화면이 스크롤되지 않게
document.addEventListener("touchmove",e=>{if(drag?.on)e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".it"))e.preventDefault();});
function endDrag(e,cancel){
  if(!drag)return;
  clearTimeout(drag.timer);
  const d=drag; drag=null;
  if(!d.on)return;
  justDragged=true; setTimeout(()=>justDragged=false,0);
  d.zone?.classList.remove("over"); d.el.classList.remove("lift"); document.body.classList.remove("dragging");
  const x=ING.find(i=>i.id===d.id), to=d.zone?.dataset.drop;
  if(cancel||!to||to===x.at){
    // 제자리로 돌아가는 모습
    const r=d.el.getBoundingClientRect();
    d.ghost.animate([{left:d.ghost.style.left,top:d.ghost.style.top},{left:r.left+"px",top:r.top+"px"}],{duration:180,easing:"cubic-bezier(.23,1,.32,1)"}).onfinish=()=>d.ghost.remove();
    return;
  }
  d.ghost.remove();
  move(x,to);
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));
// 끌기 뒤 따라오는 click 은 모달을 열지 않는다
document.addEventListener("click",e=>{if(justDragged){e.stopPropagation();e.preventDefault();}},true);

async function move(x,to){
  const from=x.at; x.at=to;
  // 옮긴 재료가 보이는 쪽으로
  const key=KEY[to], idx=at(to).indexOf(x);
  renderStore(); page[key]=Math.floor(idx/SIZE[key]); renderStore();
  const el=document.querySelector(`.it[data-i="${x.id}"]`);
  el?.animate([{transform:"scale(.85)",opacity:.4},{transform:"none",opacity:1}],{duration:220,easing:"cubic-bezier(.23,1,.32,1)"});
  const ok=await patchLocation(x.id,API_LOC[to]);
  if(!ok){x.at=from;renderStore();toast(`${x.n}을(를) 옮기지 못했어요`);}
}
// 시안: 서버 대신 0.3초 뒤 성공. 실제는 PATCH /ingredients/{id} { storageLocation: "FREEZER" | "FRIDGE" | "SHELF" | "WAREHOUSE" }
function patchLocation(id,loc){
  console.log("PATCH /ingredients/"+id,{storageLocation:loc});
  return new Promise(r=>setTimeout(()=>r(!window.FAIL),300));
}
function toast(t){
  const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.append(el);
  setTimeout(()=>el.remove(),2400);
}
$("#tblBody").addEventListener("click",e=>{const r=e.target.closest("tr[data-i]");if(r)open(ingModal(ING.find(x=>x.id===r.dataset.i)),r);});

/* ── 모달 ── */
const X=`<button class="x" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
let lastFocus=null;
function open(html,from){
  $("#modal").innerHTML=html;
  if(from){const r=from.getBoundingClientRect();
    $("#modal").style.transformOrigin=`${r.left+r.width/2-innerWidth/2+360}px ${r.top+r.height/2-40}px`;}
  document.documentElement.style.overflow="hidden";
  $("#scrim").classList.add("on");lastFocus=from;
  $("#modal").scrollTop=0;$(".x").focus({preventScroll:true});
}
function close(){$("#scrim").classList.remove("on");document.documentElement.style.overflow="";lastFocus?.focus({preventScroll:true});}

function ingModal(x){
  const s=SUP.find(s=>s.id===x.sup);
  const low=x.q!==null&&x.q<x.safe;
  const runOut=x.q===null?"–":`${Math.max(0,Math.floor(x.q/x.day))}일 뒤`;
  const max=Math.max(...x.week);
  return `<div class="mh"><h2>${x.n}</h2><span class="tag">${x.at==="창고"?"창고":x.at==="선반"?"실온":x.at}</span>${X}</div>
  <div class="mb">
    <div class="blk" id="stk">
      <div class="stock">
        <div><div class="lb">${x.when?x.when+" 실사":"추정 재고"}</div>
          <div class="v num${low?" low":""}">${x.q===null?"–":fmt(x.q)}<small>${x.u}</small></div></div>
        <button class="btn count-open" data-count>재고 직접 입력</button>
      </div>
      <div class="cnt">
        <button class="step" data-d="-1" aria-label="줄이기">−</button>
        <input class="num" id="cntIn" inputmode="decimal" value="${x.q??""}" aria-label="지금 있는 양"><span class="u">${x.u}</span>
        <button class="step" data-d="1" aria-label="늘리기">+</button>
        <button class="btn" data-save="${x.id}">저장</button>
      </div>
    </div>
    <div class="blk"><dl class="kv">
      <div><dt>안전재고</dt><dd class="num">${fmt(x.safe)} ${x.u}</dd></div>
      <div><dt>하루 평균 사용</dt><dd class="num">${fmt(x.day)} ${x.u}</dd></div>
      <div><dt>다 떨어지는 날</dt><dd>${runOut}</dd></div>
      <div><dt>거래처</dt><dd>${s.name}</dd></div>
      <div><dt>상품</dt><dd>${x.pk}</dd></div>
      <div><dt>단가</dt><dd class="num">${x.price}</dd></div>
    </dl></div>
    <div class="blk"><h3>최근 7일 사용량</h3>
      <div class="bars">${x.week.map((v,k)=>`<div><em class="num">${fmt(v)}<small>${x.u}</small></em><i style="height:${Math.max(4,v/max*72)}%;animation-delay:${k*30}ms"></i><span>${ORDER_DATE[(k+3)%7]}</span></div>`).join("")}</div>
    </div>
  </div>`;
}

const CHS=["카톡","전화","문자","이메일","웹"];
const BLANK={id:null,name:"",ch:"카톡",cut:"",days:[],lead:"",cycle:"",min:"",tpl:""};
// 거래처 모달. edit 이면 같은 자리의 글자가 입력칸으로 바뀐다 (새 화면 없음)
function supModal(s,edit=false){
  const items=s.id?ING.filter(x=>x.sup===s.id):[];
  const inp=(k,v,type="text",unit="")=>`<span class="edw"><input class="ed${type==="number"?" num":""}" data-f="${k}" type="${type}" value="${v}"${type==="number"?' min="0" inputmode="numeric"':""}>${unit?`<small>${unit}</small>`:""}</span>`;
  const dd=(view,ed)=>edit?ed:view;
  return `<div class="mh">${edit?`<input class="ed name" data-f="name" value="${s.name}" placeholder="거래처 이름" aria-label="거래처 이름">`:`<h2>${s.name}</h2>`}${X}</div>
  <div class="mb">
    <div class="blk"><dl class="kv">
      <div><dt>주문 마감</dt><dd class="num">${dd(s.cut||"–",inp("cut",s.cut,"time"))}</dd></div>
      <div${edit?' class="wide2"':""}><dt>배송 요일</dt><dd>${dd(s.days.join(" · ")||"–",`<span class="days">${DAYS.map(d=>`<button type="button" aria-pressed="${s.days.includes(d)}">${d}</button>`).join("")}</span>`)}</dd></div>
      <div><dt>배송 기간</dt><dd>${dd(s.lead===""?"–":s.lead+"일",inp("lead",s.lead,"number","일"))}</dd></div>
      <div><dt>주문 간격</dt><dd>${dd(s.cycle===""?"–":s.cycle+"일",inp("cycle",s.cycle,"number","일"))}</dd></div>
      <div><dt>최소 주문금액</dt><dd class="num">${dd(s.min?won(s.min):"없음",inp("min",s.min,"number","원"))}</dd></div>
      <div><dt>주문 방법</dt><dd>${dd(s.ch,`<select class="ed" data-f="ch">${CHS.map(c=>`<option${c===s.ch?" selected":""}>${c}</option>`).join("")}</select>`)}</dd></div>
    </dl></div>
    ${items.length?`<div class="blk rows"><h3>시켰던 재료 ${items.length}<span>최근 주문일</span></h3>
      ${items.map(x=>`<div class="r"><span><b>${x.n}</b><small>${x.pk}</small></span><span class="num">${x.price}</span><span class="d">${x.last}</span></div>`).join("")}
    </div>`:""}
    ${edit?`<div class="blk"><h3>주문 메시지</h3><textarea class="ed msg" data-f="tpl" rows="4">${s.tpl}</textarea></div>`
      :s.tpl?`<div class="blk"><h3>주문 메시지</h3><div class="msg">${s.tpl}</div></div>`:""}
    <div class="acts">${edit
      ?`${s.id?`<button class="btn ghost del" data-del="${s.id}">삭제</button>`:""}<span class="grow"></span><button class="btn ghost" data-cancel="${s.id??""}">취소</button><button class="btn" data-keep="${s.id??""}">${s.id?"저장":"추가"}</button>`
      :`<button class="btn ghost" data-edit="${s.id}">정보 고치기</button>`}</div>
  </div>`;
}
function keep(id){
  const m=$("#modal"), v=k=>m.querySelector(`[data-f="${k}"]`).value.trim();
  if(!v("name"))return m.querySelector('[data-f="name"]').focus();
  const n=x=>x===""?"":Number(x);
  const s=id?SUP.find(x=>x.id===id):{id:"s"+(SUP.length+1)};
  Object.assign(s,{name:v("name"),ch:v("ch"),cut:v("cut"),lead:n(v("lead")),cycle:n(v("cycle")),min:n(v("min"))||0,tpl:v("tpl"),
    days:[...m.querySelectorAll(".days button[aria-pressed=true]")].map(b=>b.textContent)});
  if(!id)SUP.push(s);
  renderStreet();m.innerHTML=supModal(s);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.v){document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a===t));
    document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===t.dataset.v));location.hash=t.dataset.v;return;}
  if(t.dataset.s)return open(supModal(SUP.find(s=>s.id===t.dataset.s)),t);
  if("add" in t.dataset){open(supModal({...BLANK,days:[]},true),t);$('[data-f="name"]').focus();return;}
  if(t.dataset.edit){$("#modal").innerHTML=supModal(SUP.find(s=>s.id===t.dataset.edit),true);return;}
  if("cancel" in t.dataset){if(!t.dataset.cancel)return close();$("#modal").innerHTML=supModal(SUP.find(s=>s.id===t.dataset.cancel));return;}
  if("keep" in t.dataset)return keep(t.dataset.keep);
  if(t.dataset.del){if(confirm("이 거래처를 삭제할까요?")){SUP.splice(SUP.findIndex(s=>s.id===t.dataset.del),1);renderStreet();close();}return;}
  if(t.dataset.i)return open(ingModal(ING.find(x=>x.id===t.dataset.i)),t);
  if("close" in t.dataset)return close();
  if("count" in t.dataset){$("#stk").classList.add("counting");const i=$("#cntIn");i.focus();i.select();return;}
  if(t.dataset.go){page.tbl=Number(t.dataset.go);renderStore();return;}
  if(t.dataset.p){page[t.dataset.p]+=Number(t.dataset.d);renderStore();return;}
  if(t.dataset.d){const i=$("#cntIn");i.value=fmt(Math.max(0,(parseFloat(i.value)||0)+Number(t.dataset.d))).replace(/,/g,"");return;}
  if(t.dataset.save){const x=ING.find(x=>x.id===t.dataset.save);const v=parseFloat($("#cntIn").value);
    if(!(v>=0))return;x.q=v;x.when="11월 5일";renderStore();$("#modal").innerHTML=ingModal(x);return;}
  if(t.closest(".days")){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!=="true");}
});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close();});
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim").classList.contains("on"))close();
  if(e.key==="Enter"&&e.target.id==="cntIn")$("[data-save]").click();});

renderStreet();
if(location.hash==="#ing")document.querySelector('[data-v="ing"]').click();
</script>
